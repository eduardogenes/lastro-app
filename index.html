<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1520">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<title>Treino Eduardo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0D1520;
  -webkit-text-size-adjust: 100%;
}

:root {
  --night:  #0D1520;
  --dusk:   #15202E;
  --raise:  #1C2A3B;
  --line:   #26374C;
  --dawn:   #F5A83C;
  --ember:  #E8734A;
  --mist:   #8DA0B8;
  --dim:    #48607C;
  --paper:  #E9EFF6;
  --f-d: 'Archivo', system-ui, sans-serif;
  --f-m: 'IBM Plex Mono', ui-monospace, monospace;
}

#app {
  font-family: var(--f-d);
  background: var(--night);
  color: var(--paper);
  margin: 0 auto;
  max-width: 460px;
  min-height: 100vh;
  padding: 0 0 110px;
  -webkit-font-smoothing: antialiased;
}

/* ---------- header ---------- */
.hdr { padding: calc(14px + env(safe-area-inset-top)) 18px 0; }
.hdr.curto { padding-bottom: 2px; }
.eyebrow {
  font-family: var(--f-m);
  font-size: 10.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--dawn);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.eyebrow span:last-child { color: var(--mist); }
.dayline { display: flex; align-items: baseline; gap: 11px; margin-top: 4px; }
.dayletter {
  font-size: 40px; font-weight: 800; line-height: .85;
  letter-spacing: -.03em; color: var(--paper);
}
.dayname { font-size: 16px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.daymeta { font-family: var(--f-m); font-size: 10.5px; color: var(--mist); margin-top: 2px; }

/* ---------- faixa da semana ---------- */
.semana { display: flex; gap: 5px; margin: 12px 0 0; }
.wd {
  flex: 1; min-width: 0; text-align: center; border-radius: 9px;
  border: 1px solid var(--line); padding: 5px 0 6px; background: transparent;
}
.wd-d {
  display: block; font-family: var(--f-m); font-size: 8.5px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
}
.wd-v {
  display: block; font-family: var(--f-d); font-weight: 700; font-size: 14px;
  color: var(--dim); margin-top: 1px; line-height: 1.1;
}
.wd.feito { border-color: var(--dawn); cursor: pointer; }
.wd.feito .wd-v { color: var(--dawn); }
.wd.hoje { background: var(--dusk); }
.wd.hoje .wd-d { color: var(--mist); }
.wd.futuro { opacity: .45; }

.daymeta b { color: var(--dawn); font-weight: 600; }
.autonota {
  font-family: var(--f-m); font-size: 10.5px; color: var(--dim);
  line-height: 1.6; padding: 22px 18px 8px;
}

.wd.livre { border-color: var(--mist); }
.wd.livre .wd-v { color: var(--mist); }
.wd:not(.feito):not(.futuro) { cursor: pointer; }
.wd:not(.feito):not(.futuro) .wd-v { color: var(--dim); }

/* ---------- acompanhamento ---------- */
.mesnav { display: flex; align-items: center; gap: 12px; margin: 16px 0 0; }
.mesnav span {
  flex: 1; text-align: center; font-size: 15px; font-weight: 600;
  letter-spacing: -.01em; text-transform: capitalize;
}
.mesnav button {
  appearance: none; cursor: pointer; background: transparent;
  border: 1px solid var(--line); color: var(--mist);
  font-size: 16px; line-height: 1; padding: 10px 15px; border-radius: 9px;
}
.mesnav button:disabled { opacity: .3; cursor: default; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 18px; }
.cal-h {
  font-family: var(--f-m); font-size: 8.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--dim); text-align: center; padding-bottom: 4px;
}
.cal-x { aspect-ratio: 1; }
.cal-d {
  aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; min-width: 0;
}
.cal-d em {
  font-style: normal; font-family: var(--f-m); font-size: 10px; color: var(--dim);
}
.cal-d i {
  font-style: normal; font-family: var(--f-d); font-weight: 700;
  font-size: 12px; color: var(--dawn); line-height: 1;
}
.cal-d.feito { border-color: rgba(245,168,60,.5); background: rgba(245,168,60,.08); cursor: pointer; }
.cal-d.feito em { color: var(--mist); }
.cal-d.hoje { border-color: var(--paper); }
.cal-d.livre { border-color: rgba(141,160,184,.5); background: rgba(141,160,184,.07); }
.cal-d.livre i { color: var(--mist); }
.cal-d.futuro { opacity: .35; }
.cal-d:not(.feito):not(.futuro) { cursor: pointer; }
.sess-l.livre { color: var(--mist); }

.mediasem {
  font-family: var(--f-m); font-size: 13px; color: var(--mist);
  margin: 20px 0 0; line-height: 1.5;
}
.mediasem b { font-size: 22px; color: var(--paper); font-weight: 600; letter-spacing: -.02em; }
.mediasem span { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }

.sessrow {
  display: flex; align-items: center; gap: 10px; cursor: pointer;
  border-bottom: 1px solid var(--line); padding: 14px 0;
}
.sessrow:last-child { border: 0; }
.sess-d { font-family: var(--f-m); font-size: 11px; color: var(--mist); min-width: 44px; }
.sess-l {
  font-family: var(--f-d); font-weight: 700; font-size: 15px; color: var(--dawn);
  min-width: 16px;
}
.sess-n { font-family: var(--f-m); font-size: 11.5px; color: var(--mist); flex: 1; min-width: 0; }
.sess-o {
  font-family: var(--f-m); font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--night); background: var(--dawn); border-radius: 4px; padding: 3px 6px;
}

/* ---------- rotation strip ---------- */
.rot { display: flex; gap: 6px; padding: 10px 18px 0; }
.rot button {
  flex: 1; appearance: none; border: 1px solid var(--line);
  background: transparent; color: var(--mist);
  font-family: var(--f-d); font-weight: 700; font-size: 14px;
  padding: 8px 0; border-radius: 9px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.rot button:hover { border-color: var(--dawn); color: var(--paper); }
.rot button.on { background: var(--dawn); border-color: var(--dawn); color: var(--night); }
.rot button.next::after {
  content: ''; display: block; width: 4px; height: 4px; border-radius: 50%;
  background: var(--dawn); margin: 4px auto -4px;
}
.rot button.on.next::after { background: var(--night); }

/* ---------- tabs ---------- */
.tabs {
  display: flex; gap: 18px; padding: 13px 18px 0;
  border-bottom: 1px solid var(--line); margin: 0 0 4px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs button { white-space: nowrap; }
.tabs button {
  appearance: none; background: none; border: 0; padding: 0 0 8px;
  font-family: var(--f-m); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--mist); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.on { color: var(--paper); border-bottom-color: var(--dawn); }

/* ---------- exercise ---------- */
.ex {
  border-bottom: 1px solid var(--line);
  padding: 11px 18px;
}
.ex-top { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.ord {
  font-family: var(--f-m); font-size: 11px; color: var(--dawn);
  padding-top: 3px; min-width: 20px;
}
.ex-body { flex: 1; min-width: 0; }
.ex-name { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.ex-sub {
  font-family: var(--f-m); font-size: 11.5px; color: var(--mist);
  margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.tag {
  font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--mist);
}
.tag.comp { border-color: #3C5A7A; color: #7FB0DC; }
.chev { color: var(--mist); font-size: 13px; padding-top: 4px; transition: transform .2s; }
.ex.open .chev { transform: rotate(90deg); }

.up {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--f-m); font-size: 10px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--night); background: var(--ember);
  padding: 3px 7px; border-radius: 4px; font-weight: 600;
}

/* ---------- sets ---------- */
.sets { display: none; padding: 10px 0 2px 30px; }
.ex.open .sets { display: block; }
.cue {
  font-size: 12px; color: var(--mist); line-height: 1.45;
  border-left: 2px solid var(--line); padding-left: 10px; margin: 0 0 10px;
}
.setrow { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.setno { font-family: var(--f-m); font-size: 11px; color: var(--mist); width: 16px; }
.setrow input {
  font-family: var(--f-m); font-size: 15px; font-weight: 500;
  background: var(--dusk); border: 1px solid var(--line); color: var(--paper);
  border-radius: 8px; padding: 8px 8px; width: 100%; min-width: 0;
  text-align: center; appearance: none; -moz-appearance: textfield;
}
.setrow input::-webkit-outer-spin-button,
.setrow input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.setrow input::placeholder { color: #48607C; }
.setrow input:focus { outline: none; border-color: var(--dawn); background: var(--raise); }
.setrow input.done { border-color: #2F5C46; }
.f { flex: 1; position: relative; }
.unit {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--f-m); font-size: 10px; color: #48607C; pointer-events: none;
}
.x { font-family: var(--f-m); font-size: 12px; color: var(--mist); }
.rest {
  appearance: none; background: var(--raise); border: 1px solid var(--line);
  color: var(--mist); font-family: var(--f-m); font-size: 10.5px;
  padding: 8px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.rest:hover { border-color: var(--dawn); color: var(--dawn); }
.lastline {
  font-family: var(--f-m); font-size: 11px; color: var(--mist);
  margin-top: 7px; padding-left: 22px;
}
.lastline b { color: var(--paper); font-weight: 500; }

.histbtn {
  appearance: none; background: transparent; border: 1px solid var(--line);
  color: var(--mist); font-family: var(--f-m); font-size: 11px;
  padding: 10px 8px; border-radius: 9px; cursor: pointer;
  margin: 0; flex: 1; min-width: 0; text-align: center;
}
.histbtn:hover { border-color: var(--dawn); color: var(--dawn); }

/* ---------- substituição ---------- */
.swapped { font-family: var(--f-m); font-size: 10.5px; color: var(--dim); margin-top: 3px; }
.tag.swap-t { border-color: #6B5230; color: var(--dawn); }
.tag.dl-t { border-color: #6B5230; color: var(--dawn); }
.swap { margin: 4px 0 6px; }
.swap-h { font-family: var(--f-m); font-size: 10.5px; color: var(--mist); margin: 6px 0 9px; line-height: 1.5; }
.swapopt {
  display: block; width: 100%; text-align: left; appearance: none; cursor: pointer;
  background: var(--dusk); border: 1px solid var(--line); border-radius: 10px;
  padding: 13px 14px; margin-bottom: 8px; color: var(--paper);
}
.swapopt b { display: block; font-family: var(--f-d); font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.swapopt span { display: block; font-family: var(--f-m); font-size: 10.5px; color: var(--mist); margin-top: 5px; line-height: 1.45; }
.swapopt:hover { border-color: var(--dawn); }
.swapopt.on { border-color: var(--dawn); background: var(--raise); }
.swapopt.cancel, .swapopt.back-orig { background: transparent; }
.swapopt.cancel b { color: var(--mist); font-family: var(--f-m); font-size: 11px; font-weight: 500; }

/* ---------- tipo de carga ---------- */
.anilhas {
  font-family: var(--f-m); font-size: 10.5px; color: var(--dim);
  margin: 0 0 4px; line-height: 1.45;
}
.anilhas b { color: var(--mist); font-weight: 500; }

/* ---------- observação e dor ---------- */
.notabtn {
  appearance: none; cursor: pointer; background: transparent; border: 0;
  color: var(--dim); font-family: var(--f-m); font-size: 10.5px;
  padding: 9px 0 2px; text-align: left; width: auto; flex: 1; min-width: 0;
}
.notabtn:hover { color: var(--mist); }
.obs { margin: 10px 0 2px; padding-top: 10px; border-top: 1px solid var(--line); width: 100%; }
.obs-h {
  font-family: var(--f-m); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); margin-bottom: 9px;
}
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  appearance: none; cursor: pointer; background: transparent;
  border: 1px solid var(--line); color: var(--mist);
  font-family: var(--f-m); font-size: 11.5px; padding: 11px 13px; border-radius: 9px;
}
.chip.on { border-color: var(--ember); color: var(--ember); background: rgba(232,115,74,.1); }
.note {
  width: 100%; margin-top: 9px; min-height: 46px; resize: vertical;
  background: var(--dusk); border: 1px solid var(--line); color: var(--paper);
  font-family: var(--f-d); font-size: 13.5px; line-height: 1.45;
  border-radius: 9px; padding: 11px;
}
.note::placeholder { color: var(--dim); }
.note:focus { outline: none; border-color: var(--dawn); background: var(--raise); }
.painflag {
  font-family: var(--f-m); font-size: 10.5px; color: var(--ember);
  margin-top: 6px; line-height: 1.4;
}
.pain {
  font-family: var(--f-m); font-size: 11px; color: var(--ember);
  margin-top: 8px; padding-left: 56px;
}
.hs-obs {
  font-size: 12.5px; color: var(--mist); line-height: 1.5;
  margin-top: 7px; padding-left: 56px;
}
.painsum {
  margin: 20px 0 0; padding: 13px 15px; border-radius: 10px;
  background: rgba(232,115,74,.11); border: 1px solid rgba(232,115,74,.4);
  font-size: 12.5px; color: #F0A98D; line-height: 1.5;
}
.painsum b { color: var(--ember); }

.vars { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
.vchip {
  appearance: none; cursor: pointer; background: transparent;
  border: 1px solid var(--line); color: var(--mist);
  font-family: var(--f-m); font-size: 11px; padding: 10px 12px; border-radius: 9px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.vchip.on { border-color: var(--dawn); color: var(--dawn); }

.dlbtn {
  appearance: none; display: block; margin-top: 11px; cursor: pointer;
  background: transparent; border: 1px solid rgba(232,115,74,.5); color: var(--ember);
  font-family: var(--f-m); font-size: 11px; padding: 11px 14px; border-radius: 9px;
}
.deload.on { background: rgba(245,168,60,.1); border-color: rgba(245,168,60,.45); color: #F3CB92; }
.deload.on b { color: var(--dawn); }
.deload.on .dlbtn { border-color: rgba(245,168,60,.5); color: var(--dawn); }

/* ---------- histórico do exercício ---------- */
.hhdr { padding: calc(18px + env(safe-area-inset-top)) 18px 0; }
.back {
  appearance: none; background: transparent; border: 1px solid var(--line);
  color: var(--mist); font-family: var(--f-m); font-size: 11px;
  padding: 10px 14px; border-radius: 9px; cursor: pointer; margin-bottom: 16px;
}
.back:hover { border-color: var(--dawn); color: var(--dawn); }
.htitle {
  font-size: 21px; font-weight: 700; letter-spacing: -.02em;
  line-height: 1.2; margin: 6px 0 8px;
}
.hwrap { padding: 18px 18px 0; }

.stats { display: flex; gap: 8px; margin: 16px 0 4px; }
.stats > div {
  flex: 1; background: var(--dusk); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 10px; min-width: 0;
}
.stats b {
  display: block; font-family: var(--f-m); font-size: 17px; font-weight: 600;
  color: var(--paper); letter-spacing: -.02em;
}
.stats b.up { color: var(--dawn); }
.stats span {
  display: block; font-family: var(--f-m); font-size: 9px; color: var(--dim);
  letter-spacing: .07em; text-transform: uppercase; margin-top: 5px; line-height: 1.35;
}

.chart { width: 100%; height: auto; display: block; margin: 18px 0 0; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .cl { fill: none; stroke: var(--dawn); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .cp { fill: var(--night); stroke: var(--dawn); stroke-width: 2; }
.chart .cp.last { fill: var(--dawn); }
.chart .vlline { fill: none; stroke: var(--mist); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .vp { fill: var(--night); stroke: var(--mist); stroke-width: 1.5; }
.chart .vp.last { fill: var(--mist); }
.chart .ax { font-family: var(--f-m); font-size: 9px; fill: var(--dim); }
.chart .axu { font-family: var(--f-m); font-size: 7.5px; fill: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.chart .vl { font-family: var(--f-m); font-size: 9.5px; fill: var(--mist); }
.chart .vl.last { fill: var(--paper); font-weight: 500; }

.legend {
  display: flex; gap: 16px; font-family: var(--f-m); font-size: 9.5px;
  color: var(--dim); letter-spacing: .06em; margin: 8px 0 2px;
}
.legend i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.legend .c i { background: var(--dawn); }
.legend .v i { background: var(--mist); }

.hs { border-bottom: 1px solid var(--line); padding: 13px 0; }
.hs:last-child { border: 0; }
.hs-top { display: flex; align-items: baseline; gap: 10px; }
.hs-date { font-family: var(--f-m); font-size: 11px; color: var(--mist); min-width: 46px; }
.hs-vol { font-family: var(--f-m); font-size: 13.5px; color: var(--paper); font-weight: 500; }
.hs-vol em { font-style: normal; font-size: 9px; color: var(--dim); letter-spacing: .06em; margin-left: 3px; }
.hs-d { font-family: var(--f-m); font-size: 10.5px; color: var(--mist); margin-left: auto; }
.hs-d.up { color: var(--dawn); }
.hs-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding-left: 56px; }
.hs-sets span {
  font-family: var(--f-m); font-size: 11.5px; color: var(--mist);
  background: var(--raise); border-radius: 5px; padding: 4px 8px;
}
.hs-sets span.nul { color: var(--dim); }
.hsec {
  font-family: var(--f-m); font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--dim); margin: 26px 0 2px;
}

.segnote {
  font-family: var(--f-m); font-size: 10.5px; color: var(--dim);
  margin: -3px 0 3px; line-height: 1.35;
}

/* ---------- cardio ---------- */
.week {
  display: flex; align-items: center; gap: 16px;
  background: var(--dusk); border: 1px solid var(--line);
  border-radius: 12px; padding: 17px 18px; margin: 14px 0 0;
}
.week-n {
  font-family: var(--f-m); font-size: 34px; font-weight: 600;
  color: var(--dawn); letter-spacing: -.03em; line-height: 1; white-space: nowrap;
}
.week-n em { font-style: normal; font-size: 15px; color: var(--dim); }
.week-s {
  font-family: var(--f-m); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--dim); line-height: 1.7;
}
.week-s b {
  display: block; font-size: 12px; letter-spacing: 0; text-transform: none;
  color: var(--mist); font-weight: 500; margin-top: 2px;
}
.week-s.ok b { color: var(--paper); }
.week-s.over b { color: var(--ember); }
.week-p { font-size: 12.5px; color: var(--mist); line-height: 1.55; margin: 13px 0 2px; }
.chip.sel { border-color: var(--dawn); color: var(--dawn); background: rgba(245,168,60,.1); }
.crule { font-family: var(--f-m); font-size: 10.5px; color: var(--dim); line-height: 1.5; margin: 16px 0 12px; }
.cwarn {
  margin: 16px 0 0; padding: 12px 14px; border-radius: 10px;
  background: rgba(232,115,74,.11); border: 1px solid rgba(232,115,74,.4);
  font-size: 12.5px; color: #F0A98D; line-height: 1.5;
}
.crow {
  display: flex; align-items: baseline; gap: 10px;
  border-bottom: 1px solid var(--line); padding: 13px 0;
}
.crow:last-child { border: 0; padding-bottom: 0; }
.crow-d { font-family: var(--f-m); font-size: 11px; color: var(--mist); min-width: 46px; }
.crow-m { font-size: 13.5px; font-weight: 600; color: var(--paper); }
.crow-n { font-family: var(--f-m); font-size: 11px; color: var(--mist); }
.crow-x {
  margin-left: auto; appearance: none; background: transparent; cursor: pointer;
  border: 1px solid var(--line); color: var(--dim);
  font-family: var(--f-m); font-size: 10px; padding: 8px 10px; border-radius: 7px;
}
.crow-x:hover { border-color: var(--ember); color: var(--ember); }

/* ---------- avisos no cartão do exercício ---------- */
.painbox {
  margin: 8px 0 2px; padding: 11px 13px; border-radius: 9px;
  background: rgba(232,115,74,.12); border: 1px solid rgba(232,115,74,.42);
  font-size: 12px; color: #F0A98D; line-height: 1.5;
}
.painbox b { display: block; color: var(--ember); font-weight: 600; margin-bottom: 3px; }
.painbtn {
  appearance: none; cursor: pointer; display: block; width: 100%;
  margin-top: 10px; padding: 11px 12px; border-radius: 8px;
  background: transparent; border: 1px solid rgba(232,115,74,.55); color: var(--ember);
  font-family: var(--f-m); font-size: 11px;
}
.pausaflag { font-family: var(--f-m); font-size: 10.5px; color: var(--dim); margin-top: 6px; }

/* ---------- bi-set ---------- */
.tag.bi-t { border-color: #3C5A7A; color: #7FB0DC; }
.rest.bi { border-color: #3C5A7A; color: #7FB0DC; }

/* ---------- aquecimento ---------- */
.aquec {
  display: flex; align-items: center; gap: 10px;
  margin: 10px 0 0; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--dusk);
  font-size: 11.5px; color: var(--mist); line-height: 1.35;
}
.aquec span { flex: 1; min-width: 0; }
.aquec b { color: var(--paper); font-weight: 600; }
.aquec.on { border-color: #2F5C46; }
.aqbtn {
  appearance: none; cursor: pointer; flex: 0 0 auto;
  padding: 9px 12px; border-radius: 8px;
  background: transparent; border: 1px solid var(--line); color: var(--mist);
  font-family: var(--f-m); font-size: 10.5px;
}
.aquec.on .aqbtn { border-color: #2F5C46; color: #7FBF9C; }

/* ações do exercício lado a lado, para o painel não virar uma coluna de botões */
.exacoes { display: flex; gap: 7px; margin: 9px 0 0; }
.exlinks { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline;
  border-top: 1px solid var(--line); margin-top: 8px; }

/* ---------- marcos ---------- */
.marco { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.marco span {
  font-family: var(--f-m); font-size: 11px; color: var(--dawn);
  border: 1px solid rgba(245,168,60,.45); background: rgba(245,168,60,.09);
  border-radius: 8px; padding: 9px 12px; line-height: 1.35;
}

/* ---------- resumo pós-treino ---------- */
.rec {
  font-family: var(--f-m); font-size: 10px; letter-spacing: .06em;
  background: var(--dawn); color: var(--night); font-weight: 600;
  border-radius: 5px; padding: 4px 8px;
}

/* ---------- correção de sessão ---------- */
.edbtn {
  appearance: none; cursor: pointer; background: transparent;
  border: 1px solid var(--line); color: var(--dim);
  font-family: var(--f-m); font-size: 10px; padding: 8px 11px;
  border-radius: 7px; margin-top: 10px; margin-left: 56px;
}
.edbtn:hover { border-color: var(--dawn); color: var(--dawn); }
.hs.editando {
  background: var(--dusk); border: 1px solid var(--dawn);
  border-radius: 11px; padding: 14px; margin: 6px 0;
}
.hs.editando .setrow { margin-bottom: 8px; }
.edrow { display: flex; gap: 9px; margin-top: 14px; }
.edrow .dbtn { flex: 1; }

/* ---------- séries por músculo ---------- */
.mus { margin-top: 4px; }
.musrow {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line);
}
.musrow:last-child { border: 0; }
.musn { flex: 0 0 108px; font-size: 12.5px; color: var(--mist); line-height: 1.25; }
.musrow.prio .musn { color: var(--paper); font-weight: 600; }
.musn i {
  display: block; font-style: normal; font-family: var(--f-m);
  font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--dawn); margin-top: 3px;
}
.musbar { flex: 1; height: 6px; background: var(--raise); border-radius: 3px; overflow: hidden; min-width: 0; }
.musbar em { display: block; height: 100%; background: var(--line); border-radius: 3px; }
.musrow.prio .musbar em { background: var(--dawn); }
.musv {
  flex: 0 0 auto; font-family: var(--f-m); font-size: 14px; color: var(--paper);
  font-weight: 500; text-align: right; min-width: 22px;
}
.musv small { display: block; font-size: 8.5px; color: var(--dim); font-weight: 400; margin-top: 2px; }
.musd { flex: 0 0 42px; font-family: var(--f-m); font-size: 10px; color: var(--mist); text-align: right; }
.musd.up { color: var(--dawn); }
.musd.down { color: var(--ember); }

/* ---------- corpo ---------- */
.verdict {
  border: 1px solid var(--line); background: var(--dusk);
  border-radius: 12px; padding: 18px; margin: 14px 0 4px;
}
.verdict-k {
  font-family: var(--f-m); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--dim);
}
.verdict-t {
  font-size: 26px; font-weight: 800; letter-spacing: -.025em;
  line-height: 1.1; margin: 7px 0 8px; color: var(--paper);
}
.verdict p { font-size: 13px; color: var(--mist); line-height: 1.55; margin: 0; }
.verdict.mais   { border-color: rgba(245,168,60,.45); background: rgba(245,168,60,.09); }
.verdict.mais .verdict-t { color: var(--dawn); }
.verdict.menos  { border-color: rgba(232,115,74,.45); background: rgba(232,115,74,.09); }
.verdict.menos .verdict-t { color: var(--ember); }
.verdict.faltam .verdict-t { color: var(--mist); }

.addrow { display: flex; gap: 9px; align-items: stretch; margin-top: 9px; }
.addrow .f { flex: 1; position: relative; min-width: 0; }
.addrow input {
  font-family: var(--f-m); font-size: 17px; font-weight: 500;
  background: var(--dusk); border: 1px solid var(--line); color: var(--paper);
  border-radius: 10px; padding: 15px 34px 15px 14px; width: 100%; height: 100%;
  appearance: none; -moz-appearance: textfield;
}
.addrow input::-webkit-outer-spin-button,
.addrow input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.addrow input::placeholder { color: var(--dim); }
.addrow input:focus { outline: none; border-color: var(--dawn); background: var(--raise); }
.addrow .unit { right: 14px; }
.addrow .dbtn { width: auto; flex: 0 0 auto; padding: 15px 20px; }
.blist { margin-top: 14px; }

/* ---------- dados ---------- */
.data { padding: 6px 18px 0; }
.dgroup { border-bottom: 1px solid var(--line); padding: 20px 0; }
.dgroup:last-of-type { border: 0; }
.dgroup h3 { font-size: 14.5px; font-weight: 700; margin: 0 0 5px; letter-spacing: -.01em; }
.dgroup p { font-size: 12.5px; color: var(--mist); line-height: 1.55; margin: 0 0 13px; }
.dbtn {
  appearance: none; width: 100%; border: 1px solid var(--line); background: var(--dusk);
  color: var(--paper); font-family: var(--f-d); font-weight: 600; font-size: 14px;
  padding: 15px; border-radius: 10px; cursor: pointer; display: block; text-align: center;
}
.dbtn + .dbtn, .dbtn + label.dbtn { margin-top: 9px; }
.dbtn:hover { border-color: var(--dawn); }
.dbtn.ghost { background: transparent; color: var(--mist); font-weight: 500; font-family: var(--f-m); font-size: 11.5px; padding: 13px; }
.dbtn input[type=file] { display: none; }
.jtext {
  width: 100%; min-height: 130px; margin-top: 10px; resize: vertical;
  background: var(--night); border: 1px solid var(--line); color: var(--mist);
  font-family: var(--f-m); font-size: 10.5px; line-height: 1.5;
  border-radius: 9px; padding: 11px; -webkit-text-size-adjust: 100%;
}
.jtext:focus { outline: none; border-color: var(--dawn); }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom));
  width: calc(100% - 36px); max-width: 424px;
  background: var(--raise); border: 1px solid var(--line); color: var(--paper);
  font-family: var(--f-m); font-size: 11.5px; line-height: 1.45;
  padding: 13px 15px; border-radius: 10px; z-index: 30;
  display: none; text-align: center;
}
#toast.on { display: block; }

/* ---------- finish ---------- */
.finish { padding: 22px 18px 8px; }
.finish button {
  width: 100%; appearance: none; border: 0; border-radius: 11px;
  background: var(--dawn); color: var(--night);
  font-family: var(--f-d); font-weight: 700; font-size: 15px;
  padding: 15px; cursor: pointer; letter-spacing: -.01em;
}
.finish button:disabled { background: var(--raise); color: var(--mist); cursor: default; }
.finish p { font-family: var(--f-m); font-size: 10.5px; color: var(--mist); text-align: center; margin: 10px 0 0; }

/* ---------- rules ---------- */
.rules { padding: 6px 18px 0; }
.rule { border-bottom: 1px solid var(--line); padding: 16px 0; }
.rule:last-child { border: 0; }
.rule h3 {
  font-size: 14.5px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em;
  display: flex; align-items: baseline; gap: 9px;
}
.rule h3 em {
  font-family: var(--f-m); font-style: normal; font-size: 10px;
  color: var(--dawn); letter-spacing: .1em;
}
.rule p { font-size: 13px; color: var(--mist); line-height: 1.55; margin: 0; }
.rule p + p { margin-top: 7px; }
.rule b { color: var(--paper); font-weight: 600; }
.warn { border-left: 2px solid var(--ember); padding-left: 11px; }
.warn h3 em { color: var(--ember); }

.danger {
  appearance: none; background: transparent; border: 1px solid var(--line);
  color: var(--mist); font-family: var(--f-m); font-size: 10.5px;
  padding: 10px 14px; border-radius: 8px; cursor: pointer; margin: 18px 0 0;
}
.danger:hover { border-color: var(--ember); color: var(--ember); }

.store {
  font-family: var(--f-m); font-size: 10.5px; color: var(--dim);
  line-height: 1.6; margin: 22px 0 0;
}
.store b { color: var(--mist); font-weight: 500; }

/* ---------- timer ---------- */
#timer {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 460px; background: var(--dusk);
  border-top: 1px solid var(--line); padding: 13px 18px;
  padding-bottom: calc(13px + env(safe-area-inset-bottom));
  display: none; align-items: center; gap: 14px; z-index: 20;
}
#timer.on { display: flex; }
#tval { font-family: var(--f-m); font-size: 27px; font-weight: 600; letter-spacing: -.02em; }
#tval.zero { color: var(--dawn); }
#tbar { flex: 1; height: 3px; background: var(--raise); border-radius: 2px; overflow: hidden; }
#tfill { height: 100%; background: var(--dawn); width: 100%; transition: width .25s linear; }
#timer button {
  appearance: none; background: none; border: 1px solid var(--line); color: var(--mist);
  font-family: var(--f-m); font-size: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer;
}

.msg { padding: 40px 18px; text-align: center; color: var(--mist); font-family: var(--f-m); font-size: 12px; }
.deload {
  margin: 16px 18px 0; padding: 13px 15px; border-radius: 10px;
  background: rgba(232,115,74,.11); border: 1px solid rgba(232,115,74,.4);
  font-size: 12.5px; color: #F0A98D; line-height: 1.5;
}
.deload b { color: var(--ember); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div id="app"><div class="msg">Carregando seu histórico…</div></div>

  <div id="tval">0:00</div>
  <div id="tbar"><div id="tfill"></div></div>
  <button onclick="stopTimer()">parar</button>
</div>

// ---------- camada de storage ----------
// Mesma interface assíncrona de window.storage: get -> {value} | null, set, delete.
// Ordem: window.storage (Claude.ai) -> localStorage (navegador) -> memória (última rede).
// Toda escrita é espelhada no localStorage, então trocar de ambiente não perde histórico.
const DB = (function () {
  let mode = null;                 // 'host' | 'local' | 'mem'
  const mem = Object.create(null);

  const hasLocal = (function () {
    try {
      const k = '__t' + Date.now();
      localStorage.setItem(k, '1');
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }  // Safari privado, file:// travado, etc.
  })();

  function localGet(k) {
    if (hasLocal) { try { return localStorage.getItem(k); } catch (e) {} }
    return k in mem ? mem[k] : null;
  }
  function localSet(k, v) {
    mem[k] = v;
    if (hasLocal) { try { localStorage.setItem(k, v); } catch (e) {} }
  }
  function localDel(k) {
    delete mem[k];
    if (hasLocal) { try { localStorage.removeItem(k); } catch (e) {} }
  }

  // Sonda de verdade: window.storage pode existir e mesmo assim falhar.
  async function probe() {
    if (mode) return mode;
    if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
      try { await window.storage.get('__probe__'); mode = 'host'; }
      catch (e) { mode = hasLocal ? 'local' : 'mem'; }
    } else {
      mode = hasLocal ? 'local' : 'mem';
    }
    return mode;
  }

  return {
    get mode() { return mode; },
    ready: probe,

    async get(k) {
      await probe();
      if (mode === 'host') {
        try {
          const r = await window.storage.get(k);
          if (r && r.value != null) return { value: r.value };
          // host vazio mas existe espelho local: resgata em vez de começar do zero
          const m = localGet(k);
          return m != null ? { value: m } : null;
        } catch (e) { mode = hasLocal ? 'local' : 'mem'; }
      }
      const v = localGet(k);
      return v != null ? { value: v } : null;
    },

    async set(k, v) {
      await probe();
      localSet(k, v);                                // espelho primeiro, sempre
      if (mode === 'host') {
        try { await window.storage.set(k, v); }
        catch (e) { mode = hasLocal ? 'local' : 'mem'; }
      }
      return true;
    },

    async delete(k) {
      await probe();
      localDel(k);
      if (mode === 'host') {
        try { await window.storage.delete(k); }
        catch (e) { mode = hasLocal ? 'local' : 'mem'; }
      }
      return true;
    }
  };
})();

// ---------- estado ----------
async function load() {
  let raw = null;
  try {
    const r = await DB.get(KEY);
    if (r && r.value) raw = r.value;
  } catch (e) { /* primeira vez: começa vazio */ }

  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') S = parsed;
    } catch (e) {
      console.error('histórico ilegível, mantido intacto no storage', e);
    }
  }
  if (!S.logs || typeof S.logs !== 'object') S.logs = {};
  if (!Array.isArray(S.done)) S.done = [];
  if (typeof S.deload !== 'boolean') S.deload = false;   // campos novos: ausentes nos dados antigos
  if (!S.draft || typeof S.draft !== 'object') S.draft = null;
  // sessão precisa de forma válida: sem sid, fechaSessao() não acha a marca
  if (!S.sessao || typeof S.sessao !== 'object' || !S.sessao.day || !S.sessao.sid) S.sessao = null;
  if (!Array.isArray(S.cardio)) S.cardio = [];
  if (typeof S.export !== 'number') S.export = 0;
  if (!S.carga || typeof S.carga !== 'object') S.carga = {};
  if (!S.body || typeof S.body !== 'object') S.body = { peso:[], cintura:[] };
  if (!Array.isArray(S.body.peso)) S.body.peso = [];
  if (!Array.isArray(S.body.cintura)) S.body.cintura = [];

  // Rascunho do modelo antigo, sem sessão: vira sessão aberta para não
  // perder um treino que estava em andamento na hora da atualização.
  if (S.draft && !S.sessao && PLAN[S.draft.day] && Object.keys(S.draft.ex || {}).length) {
    S.sessao = { day: S.draft.day, inicio: S.draft.t || Date.now(), ultima: S.draft.t || Date.now(), sid: S.draft.t || Date.now() };
    projetaTudo();
  }

  encerraSePreciso();
  view.day = S.sessao ? S.sessao.day : nextDay();
  render();
}

// ---------- ciclo de vida da sessão ----------
// Não existe botão de salvar. A sessão nasce na primeira série completa e
// se encerra sozinha por inatividade ou na virada do dia.
const SESSAO_LIMITE = 4*3600*1000;

function sessaoAberta() { return S.sessao || null; }

function encerraSePreciso() {
  const s = S.sessao;
  if (!s) return false;
  if (s.retro) {
    // sessão retroativa fecha por inatividade real ou na virada do dia de uso
    const ref = s.tocado || s.inicio;
    if (Date.now() - ref < SESSAO_LIMITE && sameDay(ref, Date.now())) return false;
    fechaSessao();
    return true;
  }
  const parada = Date.now() - (s.ultima || s.inicio);
  if (parada < SESSAO_LIMITE && sameDay(s.inicio, Date.now())) return false;
  fechaSessao();
  return true;
}

function fechaSessao() {
  const s = S.sessao;
  if (!s) return;
  const marca = S.done.filter(function (x) { return x.sid === s.sid; })[0];
  // retroativo já veio com a duração informada no formulário, se houve
  if (marca && !s.retro) marca.dur = Math.max(0, (s.ultima || s.inicio) - s.inicio);
  S.sessao = null;
  S.draft = null;
  view.fired = {};
  view.day = nextDay();
}

// ---------- projeção: rascunho vira histórico na hora ----------
// O rascunho continua sendo o buffer de digitação, mas cada série completa
// é escrita no histórico imediatamente. Não existe estado "não salvo".
function abreSessao(dia) {
  if (S.sessao) return S.sessao;
  const agora = Date.now();
  S.sessao = { day: dia, inicio: agora, ultima: agora, sid: agora };
  const marca = { day: dia, t: agora, sid: agora };
  if (S.deload) marca.dl = 1;
  S.done.push(marca);
  if (S.done.length > 3000) S.done = S.done.slice(-3000);
  return S.sessao;
}

function setsDoRascunho(ex, e, key) {
  const seg = isTime(ex);
  const corpo = isCorpo(key, ex);
  const sets = [];
  let any = false;
  for (let k = 0; k < setsFor(ex); k++) {
    const x = e.s[k];
    // em exercício por tempo ou de peso do corpo o segundo campo basta
    const ok = x && x[1] != null && (seg || corpo || x[0] != null);
    if (ok) { sets.push([x[0] != null ? x[0] : 0, x[1]]); any = true; }
    else sets.push(null);
  }
  return any ? sets : null;
}

function projeta(i) {
  const dia = view.day;
  const ex = PLAN[dia].ex[i];
  const e = draftPeek(i);
  if (!ex || !e) return;

  const key = e.alt ? id(dia,i) + '~' + e.alt : id(dia,i);
  const sets = setsDoRascunho(ex, e, key);

  // sem nenhuma série completa: apaga o que já tiver sido escrito nesta sessão
  if (!sets) { removeProjecao(key); return; }

  const s = abreSessao(dia);
  if (s.retro) { s.tocado = Date.now(); }
  else { s.ultima = Date.now(); s.day = dia; }

  if (!S.logs[key]) S.logs[key] = [];
  let entry = S.logs[key].filter(function (x) { return x.sid === s.sid; })[0];
  // a entrada leva a data da sessão: num registro retroativo, o treino
  // aconteceu ontem, não agora
  if (!entry) { entry = { t: s.inicio, sid: s.sid }; S.logs[key].push(entry); }

  entry.sets = sets;
  if (isTime(ex)) entry.u = 'seg'; else delete entry.u;
  if (e.aq) entry.aq = 1; else delete entry.aq;
  const obs = (e.obs||'').trim();
  if (obs) entry.obs = obs; else delete entry.obs;
  if (e.dor && e.dor.length) entry.dor = e.dor.slice(); else delete entry.dor;
  if (S.deload) entry.dl = 1; else delete entry.dl;

  if (S.logs[key].length > 500) S.logs[key] = S.logs[key].slice(-500);
}

function removeProjecao(key) {
  const s = S.sessao;
  if (!s || !S.logs[key]) return;
  S.logs[key] = S.logs[key].filter(function (x) { return x.sid !== s.sid; });
  if (!S.logs[key].length) delete S.logs[key];
}

// reprojeta o dia inteiro: usado ao migrar rascunho antigo e ao trocar exercício
function projetaTudo() {
  const dia = S.sessao ? S.sessao.day : view.day;
  if (!PLAN[dia] || !S.draft || S.draft.day !== dia) return;
  PLAN[dia].ex.forEach(function (ex, i) { projeta(i); });
}

// entradas da sessão aberta não servem de referência para elas mesmas
function historico(key) {
  const h = S.logs[key] || [];
  const s = S.sessao;
  return s ? h.filter(function (x) { return x.sid !== s.sid; }) : h;
}

async function save() {
  try { await DB.set(KEY, JSON.stringify(S)); return true; }
  catch (e) { console.error('não salvou', e); return false; }
}

// ---------- helpers ----------
// Sessão avulsa (fora do plano) não move a rotação nem entra na conta das 48:
// ela é presença, não é o programa.
function ultimaDoPlano() {
  for (let i = S.done.length-1; i >= 0; i--) if (S.done[i].day && !S.done[i].livre) return S.done[i];
  return null;
}
function nextDay() {
  const u = ultimaDoPlano();
  if (!u) return 'A';
  const i = ROT.indexOf(u.day);
  return ROT[(i+1) % 6];
}
function id(d,i){ return d + i; }

// ---------- rascunho do treino em andamento ----------
// Antes disso, abrir outro exercício apagava o que já tinha sido digitado:
// render() reescreve o innerHTML e os valores viviam só no DOM.
function draftOf(i) {
  if (!S.draft || S.draft.day !== view.day) S.draft = { day: view.day, t: Date.now(), ex: {} };
  if (!S.draft.ex[i]) S.draft.ex[i] = { s: [], obs: '', dor: [], alt: null };
  const e = S.draft.ex[i];
  if (!Array.isArray(e.s)) e.s = [];
  if (!Array.isArray(e.dor)) e.dor = [];
  return e;
}
// Reconstrói o rascunho a partir do que a sessão aberta já registrou.
// Sem isso, navegar entre os dias da rotação no meio do treino deixava os
// campos em branco — e digitar por cima apagaria as séries que já existiam,
// porque projeta() reescreve o conjunto inteiro a partir do rascunho.
function hidrataDraft(dia) {
  const s = S.sessao;
  if (!s || s.day !== dia || !PLAN[dia]) return;
  // criar rascunho vazio aqui contaminaria o estado: na abertura seguinte a
  // migração de rascunho antigo o leria como treino em andamento
  if (!S.draft || S.draft.day !== dia) S.draft = { day: dia, t: Date.now(), ex: {} };

  PLAN[dia].ex.forEach(function (ex, i) {
    if (S.draft.ex[i]) return;
    const base = id(dia, i);
    const chave = Object.keys(S.logs).filter(function (k) {
      return (k === base || k.indexOf(base + '~') === 0) &&
             S.logs[k].some(function (e) { return e.sid === s.sid; });
    })[0];
    if (!chave) return;
    const e = S.logs[chave].filter(function (x) { return x.sid === s.sid; })[0];
    S.draft.ex[i] = {
      s: e.sets.map(function (x) { return x ? [x[0], x[1]] : [null, null]; }),
      obs: e.obs || '',
      dor: (e.dor || []).slice(),
      alt: chave === base ? null : chave.slice(base.length + 1),
      aq: !!e.aq
    };
  });
}

function draftPeek(i) {
  return (S.draft && S.draft.day === view.day && S.draft.ex && S.draft.ex[i]) || null;
}
let saveT = null;
function queueSave() {
  if (S.draft) S.draft.t = Date.now();
  clearTimeout(saveT);
  saveT = setTimeout(save, 700);
}

// ---------- substituição ----------
function altOf(i) { const e = draftPeek(i); return e && e.alt ? e.alt : null; }
function exName(d,i) { return altOf(i) || PLAN[d].ex[i].n; }
// carga de substituto nunca entra no histórico do original
function logKey(d,i) { const a = altOf(i); return a ? id(d,i) + '~' + a : id(d,i); }
function altList(d,i) { return ALT[PLAN[d].ex[i].n] || []; }
// chaves de substitutos já registrados neste exercício
function variantsOf(d,i) {
  const base = id(d,i) + '~';
  return Object.keys(S.logs).filter(k => k.indexOf(base) === 0 && S.logs[k] && S.logs[k].length)
    .map(k => ({ key:k, name:k.slice(base.length) }));
}

// ---------- séries: deload corta pela metade, sem tocar na carga ----------
function setsFor(ex) { return S.deload ? Math.ceil(ex.s/2) : ex.s; }

// ---------- pausa longa ----------
// Depois de duas semanas parado, propor a carga anterior e mandar subir é o
// oposto do que o resto do app defende. O selo fica suspenso até haver sessão nova.
const PAUSA_DIAS = 14;
function diasDesde(t) { return (Date.now() - t) / 86400000; }
function pausaGeral() { return S.done.length ? diasDesde(S.done[S.done.length-1].t) : 0; }
function sessoesDeTrabalho() { return S.done.filter(function (x) { return !x.dl && !x.livre; }).length; }
function diasSemBackup() {
  if (S.export) return diasDesde(S.export);
  return S.done.length ? diasDesde(S.done[0].t) : 0;
}

// ---------- marcos de adesão ----------
function marcos() {
  const out = [];
  const n = S.done.length;
  if (n && n % 25 === 0) out.push(`Sessão número ${n}.`);

  const porSemana = {};
  S.done.forEach(function (x) { const k = weekStart(x.t); porSemana[k] = (porSemana[k]||0) + 1; });
  let seq = 0;
  // só semanas fechadas: a semana em andamento ainda pode não bater a meta
  for (let k = weekStart(Date.now()) - 7*86400000; seq < 300; k -= 7*86400000) {
    if ((porSemana[k]||0) >= 4) seq++; else break;
  }
  if (seq >= 3) out.push(`${seq} semanas seguidas com 4 ou mais treinos.`);
  return out;
}
function pausaEx(key) { const h = historico(key); return h.length ? diasDesde(h[h.length-1].t) : 0; }

// dor marcada nas duas últimas sessões do mesmo exercício
function dorSeguida(key) {
  const h = historico(key);
  if (h.length < 2) return null;
  const a = h[h.length-1], b = h[h.length-2];
  if (!a.dor || !a.dor.length || !b.dor || !b.dor.length) return null;
  const comum = a.dor.filter(x => b.dor.indexOf(x) >= 0);
  return comum.length ? comum : null;
}
// placeholder: procura o valor mais recente daquela série, pulando semanas de deload
function lastSet(key, k) {
  const h = historico(key);
  for (let j = h.length-1; j >= 0; j--) if (h[j].sets && h[j].sets[k]) return h[j].sets[k];
  return null;
}
// não pode se chamar top(): window.top é read-only no escopo global de um documento
function topReps(r){ return parseInt(r.split(/[–-]/)[1], 10); }
function lastOf(d,i){ const h = historico(id(d,i)); return h.length ? h[h.length-1] : null; }
// Exercício por tempo: a série continua sendo [a,b], mas b são segundos
// em vez de repetições e a carga é opcional (0 = peso do corpo).
function isTime(ex) { return !!(ex && ex.u === 'seg'); }
function cargaTipo(key, ex) {
  if (S.carga && S.carga[key]) return S.carga[key];
  return (ex && ex.car) || 'pino';
}
function isCorpo(key, ex) { return cargaTipo(key, ex) === 'corpo'; }
// total em anilhas: sempre 2x o lado, nunca somando a barra
function totalAnilhas(v) { return v > 0 ? v*2 : 0; }
function tutOf(l) { return l.sets.reduce((a,s) => a + (s ? s[1] : 0), 0); }
function entryTime(l, ex) { return l && (l.u === 'seg' || isTime(ex)); }

function shouldUp(d,i,ex) {
  if (isTime(ex)) return false;   // prancha não ganha selo de subir carga
  if (pausaEx(id(d,i)) >= PAUSA_DIAS) return false;   // voltando de pausa longa
  const l = lastOf(d,i);
  if (!l || l.sets.length < ex.s) return false;
  const t = topReps(ex.r);
  return l.sets.every(s => s && s[1] >= t && s[0] > 0);
}
function fmtLast(l, seg) {
  if (!l) return null;
  if (seg) return l.sets.map(s => s ? (s[0] ? fmtNum(s[0])+'kg×'+s[1]+'s' : s[1]+'s') : '–').join('  ');
  return l.sets.map(s => s ? fmtNum(s[0])+'×'+s[1] : '–').join('  ');
}

// ---------- números e volume ----------
function fmtNum(n) { return n % 1 === 0 ? String(n) : String(Math.round(n*10)/10); }
function fmtInt(n) { return Math.round(n).toLocaleString('pt-BR'); }
const DIAS_CURTOS = ['seg','ter','qua','qui','sex','sáb','dom'];
const DIAS_LONGOS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function fmtDur(ms) {
  if (ms == null) return '–';
  const m = Math.round(ms/60000);
  if (m < 60) return m + ' min';
  return Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0');
}
function diaExtenso(t) {
  const d = new Date(t);
  return DIAS_LONGOS[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + ' de ' + MESES[d.getMonth()];
}
function sessoesDoDia(t) { return S.done.filter(function (x) { return sameDay(x.t, t); }); }
function marcaDe(m) { return m.livre ? '•' : m.day; }

function fmtDate(t) {
  const d = new Date(t);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
}
// volume = soma de peso × repetições. Sobe mesmo com a carga parada,
// que é o ponto: mostra progresso quando o número da barra não muda.
function volOf(l)  { return l.sets.reduce((a,s) => a + (s ? s[0]*s[1] : 0), 0); }
function maxLoad(l){ return l.sets.reduce((a,s) => (s && s[0] > a ? s[0] : a), 0); }
function repsOf(l) { return l.sets.reduce((a,s) => a + (s ? s[1] : 0), 0); }
function histOf(d,i,n) { const h = S.logs[id(d,i)] || []; return n ? h.slice(-n) : h.slice(); }

// ---------- gráfico (SVG puro) ----------
// Duas faixas empilhadas: carga em cima (âmbar, protagonista) e volume embaixo
// (cinza, secundário). Cada faixa tem escala própria com mínimo e máximo escritos
// no eixo — é o que deixa visível o volume subindo com a carga parada.
function fmtK(n) {
  n = Math.round(n);
  return n >= 1000 ? String(Math.round(n/100)/10).replace('.', ',') + 'k' : String(n);
}
function chartSVG(H, modo, rot) {
  if (!H.length) return '';
  const n = H.length;

  // faixa de cima: o que progride. Embaixo: a métrica de apoio, quando existe.
  // Em peso do corpo, quem progride é a repetição; a carga é o acessório.
  let A, B = null;
  if (modo === 'seg') {
    A = { v: H.map(tutOf), u:'seg', f: fmtInt };
    if (H.some(function (x) { return maxLoad(x) > 0; })) B = { v: H.map(maxLoad), u: rot||'kg', f: fmtNum };
  } else if (modo === 'corpo') {
    A = { v: H.map(repsOf), u:'reps', f: fmtInt };
    if (H.some(function (x) { return maxLoad(x) > 0; })) B = { v: H.map(maxLoad), u:'+kg', f: fmtNum };
  } else {
    A = { v: H.map(maxLoad), u: rot||'kg', f: fmtNum };
    B = { v: H.map(volOf), u:'vol', f: fmtK };
  }

  const x0 = 46, x1 = 292;
  const aT = 22, aB = B ? 68 : 100;
  const bT = 94, bB = 124;
  const alt = (B ? bB : aB) + 16;
  const aHi = Math.max.apply(null, A.v), aLo = Math.min.apply(null, A.v);
  const px = i => n === 1 ? (x0+x1)/2 : x0 + (x1-x0) * i/(n-1);
  const ay = v => aHi === aLo ? (aT+aB)/2 : aB - (v-aLo)/(aHi-aLo) * (aB-aT);
  const anchor = i => i === 0 && n > 1 ? 'start' : (i === n-1 && n > 1 ? 'end' : 'middle');

  let g = `<svg viewBox="0 0 320 ${alt+8}" class="chart" role="img" aria-label="progresso das últimas ${n} sessões">`;

  g += `<line x1="${x0}" y1="${aT}" x2="${x1}" y2="${aT}" class="gl"/>`
     + `<line x1="${x0}" y1="${aB}" x2="${x1}" y2="${aB}" class="gl"/>`
     + `<text x="${x0-8}" y="${ay(aHi)+3}" class="ax" text-anchor="end">${A.f(aHi)}</text>`
     + (aHi === aLo ? '' : `<text x="${x0-8}" y="${aB+3}" class="ax" text-anchor="end">${A.f(aLo)}</text>`)
     + `<text x="${x0-8}" y="${aT-9}" class="axu" text-anchor="end">${A.u}</text>`;
  if (n > 1) g += `<polyline class="cl" points="${H.map((h,i)=> px(i)+','+ay(A.v[i])).join(' ')}"/>`;
  H.forEach((h,i) => {
    const last = i === n-1;
    g += `<circle cx="${px(i)}" cy="${ay(A.v[i])}" r="${last?4.5:3.5}" class="cp${last?' last':''}"/>`
       + `<text x="${px(i)}" y="${ay(A.v[i])-11}" class="vl${last?' last':''}" text-anchor="${anchor(i)}">${A.f(A.v[i])}</text>`;
  });

  if (B) {
    const bHi = Math.max.apply(null, B.v), bLo = Math.min.apply(null, B.v);
    const by = v => bHi === bLo ? (bT+bB)/2 : bB - (v-bLo)/(bHi-bLo) * (bB-bT);
    g += `<line x1="${x0}" y1="${bT}" x2="${x1}" y2="${bT}" class="gl"/>`
       + `<line x1="${x0}" y1="${bB}" x2="${x1}" y2="${bB}" class="gl"/>`
       + `<text x="${x0-8}" y="${by(bHi)+3}" class="ax" text-anchor="end">${B.f(bHi)}</text>`
       + (bHi === bLo ? '' : `<text x="${x0-8}" y="${bB+3}" class="ax" text-anchor="end">${B.f(bLo)}</text>`)
       + `<text x="${x0-8}" y="${bT-9}" class="axu" text-anchor="end">${B.u}</text>`;
    if (n > 1) g += `<polyline class="vlline" points="${H.map((h,i)=> px(i)+','+by(B.v[i])).join(' ')}"/>`;
    H.forEach((h,i) => {
      g += `<circle cx="${px(i)}" cy="${by(B.v[i])}" r="${i===n-1?4:3}" class="vp${i===n-1?' last':''}"/>`;
    });
  }

  H.forEach((h,i) => {
    g += `<text x="${px(i)}" y="${alt}" class="ax" text-anchor="${anchor(i)}">${fmtDate(h.t)}</text>`;
  });
  return g + '</svg>';
}

// ---------- total do que está montado ----------
// Só para os tipos que se dobram: anilha por lado e halter em cada mão.
// Nunca soma o peso da barra, que varia demais para ser chutado.
function textoTotal(i, key, ex) {
  const c = CARGAS[cargaTipo(key, ex)];
  if (!c || !c.dobra) return '';
  const dr = draftPeek(i);
  let v = null;
  if (dr) for (let k = setsFor(ex)-1; k >= 0; k--) if (dr.s[k] && dr.s[k][0] != null) { v = dr.s[k][0]; break; }
  if (v == null) { const p = lastSet(key, 0); if (p) v = p[0]; }
  if (!v) return '';
  return `${fmtNum(v)} ${c.cada} · <b>${fmtNum(totalAnilhas(v))} kg ${c.total}</b>${c.obs}`;
}

function atualizaAnilhas(i) {
  const el = document.getElementById('tot' + i);
  if (!el) return;
  const ex = PLAN[view.day].ex[i];
  el.innerHTML = textoTotal(i, logKey(view.day, i), ex);
}

// ---------- estado do dia ----------
// Vive num elemento próprio para poder ser atualizado sem re-render: inp()
// evita render() de propósito, senão o campo perde o foco a cada tecla.
function estadoDoDia(P) {
  const aberta = S.sessao;
  if (aberta && aberta.retro) {
    const r = resumoDaSessao(aberta);
    return `<b>preenchendo ${fmtDate(aberta.inicio)}</b> · ${r.series} ${r.series===1?'série':'séries'}${r.vol?' · '+fmtInt(r.vol)+' kg×reps':''}`;
  }
  if (aberta) {
    const r = resumoDaSessao(aberta);
    return `<b>em andamento</b> · ${fmtDur(aberta.ultima - aberta.inicio)} · ${r.series} ${r.series===1?'série':'séries'}${r.vol?' · '+fmtInt(r.vol)+' kg×reps':''}`;
  }
  const hoje = sessoesDoDia(Date.now());
  if (hoje.length) {
    const m = hoje[hoje.length-1];
    const r = resumoDaSessao(m);
    return m.livre
      ? `<b>treino avulso hoje</b> · ${(m.grupos||[]).join(', ')}`
      : `<b>treino ${m.day} encerrado hoje</b> · ${fmtDur(m.dur)} · ${r.series} ${r.series===1?'série':'séries'}`;
  }
  return `${P.tag} · ${P.ex.reduce(function (a,e) { return a+e.s; }, 0)} séries prescritas`;
}

function atualizaEstado() {
  const el = document.getElementById('daymeta');
  if (el && PLAN[view.day]) el.innerHTML = estadoDoDia(PLAN[view.day]);
}

// ---------- faixa da semana ----------
// Sete colunas de segunda a domingo. A letra do treino no dia em que houve
// treino, um ponto apagado no dia em que não houve. Sem julgamento, só o fato.
function faixaSemana() {
  const ini = weekStart(Date.now());
  let cel = '';
  for (let i = 0; i < 7; i++) {
    const dia = ini + i*86400000;
    const marcas = sessoesDoDia(dia);
    const hoje = sameDay(dia, Date.now());
    const futuro = dia > Date.now() && !hoje;
    const livre = marcas.length && marcas.every(function (m) { return m.livre; });
    const acao = marcas.length ? `abrirSessao(${marcas[marcas.length-1].t})` : (futuro ? '' : `abrirAdicionar(${dia})`);
    cel += `<div class="wd ${hoje?'hoje':''} ${marcas.length?'feito':''} ${livre?'livre':''} ${futuro?'futuro':''}"
      ${acao?`onclick="${acao}"`:''}>
      <span class="wd-d">${DIAS_CURTOS[i]}</span>
      <span class="wd-v">${marcas.length ? marcas.map(marcaDe).join('') : '+'}</span>
    </div>`;
  }
  return '<div class="semana">' + cel + '</div>';
}

// ---------- render ----------
function render() {
  if (view.retro) return renderRetro();
  if (view.add) return renderAdicionar();
  if (view.sessao) return renderSessao();
  if (view.hist) return renderHist();
  const app = document.getElementById('app');
  const d = view.day, P = PLAN[d];
  const cycle = Math.floor(S.done.length/6) + 1;
  const trabalho = sessoesDeTrabalho();
  const toDeload = 48 - (trabalho % 48);

  const naTreino = view.tab === 'treino';
  if (naTreino) hidrataDraft(d);
  let h = `<div class="hdr ${naTreino?'':'curto'}">
    <div class="eyebrow"><span>${diaExtenso(Date.now())}</span><span>ciclo ${cycle} · ${S.done.length} sessões</span></div>
    ${naTreino ? `<div class="dayline">
      <div class="dayletter">${d}</div>
      <div><div class="dayname">${P.name}</div><div class="daymeta" id="daymeta">${estadoDoDia(P)}</div></div>
    </div>
    ${faixaSemana()}` : ''}
  </div>
  ${view.tab==='treino' ? '<div class="rot">' +
    ROT.map(x => `<button class="${x===view.day?'on':''} ${x===nextDay()?'next':''}" onclick="go('${x}')">${x}</button>`).join('') +
  '</div>' : ''}
  <div class="tabs">
    <button class="${view.tab==='treino'?'on':''}" onclick="tab('treino')">hoje</button>
    <button class="${view.tab==='acomp'?'on':''}" onclick="tab('acomp')">acompanhamento</button>
    <button class="${view.tab==='corpo'?'on':''}" onclick="tab('corpo')">corpo</button>
    <button class="${view.tab==='ajustes'?'on':''}" onclick="tab('ajustes')">ajustes</button>
  </div>`;

  if (naTreino && S.sessao && S.sessao.retro)
    h += `<div class="deload on"><b>Preenchendo o treino de ${diaExtenso(S.sessao.inicio)}.</b>
      As séries que você digitar entram nessa data, não em hoje.
      <button class="dlbtn" onclick="concluirRetro()">concluir</button></div>`;

  if (naTreino && trabalho > 0 && trabalho % 48 === 0)
    h += `<div class="deload on"><b>Bloco de 48 sessões concluído.</b>
      Semana de deload e uma olhada no que evoluiu.
      <button class="dlbtn" onclick="abrirRetro()">ver retrospectiva</button></div>`;

  const parado = pausaGeral();
  if (naTreino && parado >= PAUSA_DIAS)
    h += `<div class="deload on"><b>${Math.round(parado)} dias desde o último treino salvo.</b>
      O selo de subir carga fica suspenso nesta volta. Os placeholders continuam mostrando a última carga registrada, só para você ter a referência.</div>`;

  if (naTreino && S.deload)
    h += `<div class="deload on"><b>Modo deload ativo.</b> Metade das séries, mesmas cargas. Os placeholders continuam mostrando a carga da última semana normal.
      <button class="dlbtn" onclick="setDeload(false)">sair do deload</button></div>`;
  else if (naTreino && toDeload <= 6 && S.done.length > 0)
    h += `<div class="deload"><b>Deload chegando.</b> Faltam ${toDeload} sessões para a semana de metade das séries.
      <button class="dlbtn" onclick="setDeload(true)">ativar agora</button></div>`;

  if (view.tab === 'ajustes') {
    h += '<div class="rules">' + RULES.map(r => `
      <div class="rule ${r.warn?'warn':''}">
        <h3><em>${r.k}</em>${r.t}</h3>
        ${r.p.map(x=>`<p>${x}</p>`).join('')}
      </div>`).join('') + '</div>' + renderData();
  } else if (view.tab === 'acomp') {
    h += renderAcomp();
  } else if (view.tab === 'corpo') {
    h += renderBody();
  } else {
    h += P.ex.map((ex,i) => {
      const alt = altOf(i);
      const key = logKey(d,i);
      const dr = draftPeek(i);
      const l = historico(key).slice(-1)[0] || null;
      const up = !alt && !S.deload && shouldUp(d,i,ex);
      const o = view.open===i;
      const ns = setsFor(ex);
      const seg = isTime(ex);
      const tipo = cargaTipo(key, ex);
      const corpo = tipo === 'corpo';
      const rot = seg ? 'kg' : CARGAS[tipo].rot;
      const dorLast = l && l.dor && l.dor.length ? l.dor : null;
      const dorRep = dorSeguida(key);
      const paradoEx = pausaEx(key);

      const lista = altList(d,i);
      let rows = '';
      for (let k=0;k<ns;k++) {
        const p = lastSet(key,k);
        const v = dr && dr.s[k] ? dr.s[k] : [null,null];
        rows += `<div class="setrow">
          <div class="setno">${k+1}</div>
          <div class="f"><input type="text" inputmode="decimal" id="w${i}_${k}"
            value="${v[0]!=null?v[0]:''}" placeholder="${p&&p[0]?fmtNum(p[0]):((seg||corpo)?'0':'kg')}"
            oninput="inp(this,${i},${k},0)"><span class="unit">${rot}</span></div>
          <div class="x">×</div>
          <div class="f"><input type="text" inputmode="numeric" id="r${i}_${k}"
            value="${v[1]!=null?v[1]:''}" placeholder="${p?p[1]:(seg?'seg':'reps')}"
            oninput="inp(this,${i},${k},1)">${seg?'<span class="unit">seg</span>':''}</div>
          ${ex.bi===1
            ? `<button class="rest bi" onclick="proximoDoBiset(${i})">próximo</button>`
            : `<button class="rest" onclick="startTimer(${ex.c?180:90})">${ex.c?'3min':'90s'}</button>`}
        </div>`;
      }
      if (seg || corpo) rows += `<div class="segnote">Carga opcional: deixe o campo vazio para só o peso do corpo.</div>`;
      if (CARGAS[tipo].dobra) rows += `<div class="anilhas" id="tot${i}">${textoTotal(i, key, ex)}</div>`;

      let swap = '';
      if (view.swapOpen === i) {
        swap = `<div class="swap">
          <div class="swap-h">Máquina ocupada? Mesmo padrão de movimento:</div>
          ${lista.map(a => `<button class="swapopt ${alt===a.n?'on':''}" onclick="setAlt(${i},'${escAttr(a.n)}')">
            <b>${a.n}</b><span>${a.w}</span></button>`).join('')}
          ${alt?`<button class="swapopt back-orig" onclick="setAlt(${i},null)"><b>Voltar para ${ex.n}</b><span>Cancela a substituição.</span></button>`:''}
          <button class="swapopt cancel" onclick="toggleSwap(${i})"><b>Fechar</b></button>
        </div>`;
      }

      return `<div class="ex ${o?'open':''}">
        <div class="ex-top" onclick="toggle(${i})">
          <div class="ord">${String(i+1).padStart(2,'0')}</div>
          <div class="ex-body">
            <div class="ex-name">${alt||ex.n}</div>
            ${alt?`<div class="swapped">no lugar de ${ex.n}</div>`:''}
            <div class="ex-sub">
              <span>${ns} × ${ex.r}</span>
              <span class="tag ${ex.c?'comp':''}">${ex.c?'composto · deixe 1–2 na reserva':'isolador · pode ir à falha'}</span>
              ${ex.bi===1?'<span class="tag bi-t">bi-set · sem pausa até o próximo</span>':''}
              ${ex.bi===2?'<span class="tag bi-t">bi-set · o descanso é aqui</span>':''}
              ${alt?'<span class="tag swap-t">substituído</span>':''}
              ${S.deload?'<span class="tag dl-t">deload</span>':''}
              ${up?'<span class="up">↑ subir carga</span>':''}
            </div>
            ${dorRep
              ? `<div class="painbox">
                   <b>Dor em ${dorRep.map(dorName).join(' e ')} nas duas últimas sessões deste exercício.</b>
                   A regra do programa é tirar o exercício por 2 semanas e trocar o ângulo, não empurrar por cima.
                   ${lista.length?`<button class="painbtn" onclick="event.stopPropagation(); abrirSubstituicao(${i})">ver alternativas</button>`:''}
                 </div>`
              : (dorLast?`<div class="painflag">dor em ${dorLast.map(dorName).join(' e ')} na última sessão deste exercício</div>`:'')}
            ${!dorRep && paradoEx >= PAUSA_DIAS && !alt?`<div class="pausaflag">${Math.round(paradoEx)} dias sem este exercício</div>`:''}
          </div>
          <div class="chev">›</div>
        </div>
        <div class="sets">
          <p class="cue">${ex.cue}</p>
          ${rows}
          ${l?`<div class="lastline">última vez: <b>${fmtLast(l,seg)}</b> · ${seg?`tempo <b>${fmtInt(tutOf(l))} s</b>`:`volume <b>${fmtInt(volOf(l))}</b>`}</div>`:'<div class="lastline">primeira vez neste exercício</div>'}
          ${i===0?`<div class="aquec ${dr&&dr.aq?'on':''}">
            <span><b>Aproximação:</b> 2 a 3 séries subindo carga antes da primeira valendo.</span>
            <button class="aqbtn" onclick="toggleAq(0)">${dr&&dr.aq?'feito':'marcar'}</button>
          </div>`:''}
          <div class="exacoes">
            ${lista.length?`<button class="histbtn" onclick="toggleSwap(${i})">${view.swapOpen===i?'fechar':'trocar exercício'}</button>`:''}
            <button class="histbtn" onclick="openHist(${i})">histórico</button>
          </div>
          ${swap}
          <div class="exlinks">
          ${view.carga === i ? `<div class="obs">
            <div class="obs-h">como esse peso é carregado</div>
            <div class="chips">${Object.keys(CARGAS).map(function (t) {
              return `<button class="chip ${tipo===t?'sel':''}" onclick="setCarga(${i},'${t}')">${CARGAS[t].nome}</button>`;
            }).join('')}</div>
            <p class="cue" style="margin:12px 0 0">${CARGAS[tipo].ajuda}</p>
          </div>` : `<button class="notabtn" onclick="abrirCarga(${i})">carga: ${CARGAS[tipo].nome}</button>`}
          ${(dr && (dr.obs || dr.dor.length)) || view.nota === i
            ? `<div class="obs">
                 <div class="obs-h">anotação desta sessão</div>
                 <textarea class="note" id="o${i}" placeholder="o que aconteceu neste exercício (opcional)"
                   oninput="obsIn(this,${i})">${dr?escapeHTML(dr.obs||''):''}</textarea>
                 <div class="obs-h" style="margin-top:14px">dor de tendão</div>
                 <div class="chips">${DORES.map(x => `<button class="chip ${dr&&dr.dor.indexOf(x.k)>=0?'on':''}" onclick="toggleDor(${i},'${x.k}')">${x.t}</button>`).join('')}</div>
               </div>`
            : `<button class="notabtn" onclick="abrirNota(${i})">anotar algo</button>`}
          </div>
        </div>
      </div>`;
    }).join('');

    h += `<div class="autonota">
      Cada série entra no histórico assim que você preenche carga e repetição.
      Não há nada para salvar. O treino se encerra sozinho e a rotação avança para ${ROT[(ROT.indexOf(d)+1)%6]}.
    </div>`;
  }

  app.innerHTML = h;
}

// ---------- histórico do exercício ----------
function renderHist() {
  const d = view.hist.day, i = view.hist.i;
  const ex = PLAN[d].ex[i];
  const vars = variantsOf(d,i);
  const sel = view.hist.key || id(d,i);
  const tipo = cargaTipo(sel, ex);
  const nome = sel === id(d,i) ? ex.n : sel.slice(id(d,i).length+1);
  const H = (S.logs[sel] || []).slice(-6);
  const app = document.getElementById('app');

  let h = `<div class="hhdr">
    <button class="back" onclick="closeHist()">‹ voltar para o treino ${d}</button>
    <div class="eyebrow"><span>treino ${d} · exercício ${String(i+1).padStart(2,'0')}</span><span>${H.length} de 6 sessões</span></div>
    <h2 class="htitle">${nome}</h2>
    <div class="ex-sub">
      <span>${ex.s} × ${ex.r}</span>
      <span class="tag ${ex.c?'comp':''}">${ex.c?'composto':'isolador'}</span>
      <span class="tag">${CARGAS[tipo].nome}</span>
      ${sel!==id(d,i)?'<span class="tag swap-t">substituto</span>':''}
      ${sel===id(d,i)&&shouldUp(d,i,ex)?'<span class="up">↑ subir carga</span>':''}
    </div>
    ${vars.length?`<div class="vars">
      <button class="vchip ${sel===id(d,i)?'on':''}" onclick="histKey('${escAttr(id(d,i))}')">${ex.n}</button>
      ${vars.map(v=>`<button class="vchip ${sel===v.key?'on':''}" onclick="histKey('${escAttr(v.key)}')">${v.name}</button>`).join('')}
    </div>`:''}
  </div>`;

  if (!H.length) {
    h += `<div class="msg">Nenhuma sessão registrada neste exercício ainda.<br>O gráfico aparece depois do primeiro treino salvo.</div>`;
    app.innerHTML = h;
    window.scrollTo(0,0);
    return;
  }

  const seg = isTime(ex) || (H[0] && H[0].u === 'seg');
  const corpo = !seg && tipo === 'corpo';
  const rotCarga = seg ? 'kg' : CARGAS[tipo].rot;
  const met = seg ? tutOf : (corpo ? repsOf : volOf);
  const last = H[H.length-1];
  const first = H[0];
  const dv = H.length > 1 && met(first) > 0
    ? Math.round((met(last) - met(first)) / met(first) * 100)
    : null;
  const comCarga = seg && H.some(x => maxLoad(x) > 0);

  h += `<div class="hwrap">
    <div class="stats">
      ${seg
        ? `<div><b>${fmtInt(tutOf(last))}</b><span>tempo da última · seg</span></div>
           <div><b>${fmtInt(Math.round(tutOf(last)/Math.max(last.sets.filter(Boolean).length,1)))}</b><span>média por série · seg</span></div>`
        : corpo
        ? `<div><b>${fmtInt(repsOf(last))}</b><span>repetições na última</span></div>
           <div><b>${maxLoad(last)?fmtNum(maxLoad(last)):'–'}</b><span>carga somada · kg</span></div>`
        : `<div><b>${fmtNum(maxLoad(last))}</b><span>carga atual · ${rotCarga}</span></div>
           <div><b>${fmtInt(volOf(last))}</b><span>volume da última</span></div>`}
      <div><b class="${dv!==null&&dv>0?'up':''}">${dv===null?'–':(dv>0?'+':'')+dv+'%'}</b><span>${seg?'tempo':(corpo?'repetições':'volume')} no período</span></div>
    </div>
    ${chartSVG(H, seg ? 'seg' : (corpo ? 'corpo' : null), rotCarga)}
    <div class="legend">
      <span class="c"><i></i>${seg?'tempo total sob tensão':(corpo?'repetições da sessão':'carga máxima da sessão')}</span>
      ${(seg||corpo) ? (H.some(function(x){return maxLoad(x)>0;})?'<span class="v"><i></i>carga adicionada</span>':'') : '<span class="v"><i></i>volume total</span>'}
    </div>
    <div class="hsec">sessão a sessão</div>`;

  const base = S.logs[sel].length - H.length;   // índice real dentro do log completo
  h += H.map((s, k) => {
    const v = met(s);
    const pv = k > 0 ? met(H[k-1]) : null;
    const delta = pv ? Math.round((v-pv)/pv*100) : null;
    const real = base + k;
    if (view.edit === real) return linhaEdicao(sel, real, s, seg);
    return `<div class="hs">
      <div class="hs-top">
        <span class="hs-date">${fmtDate(s.t)}</span>
        <span class="hs-vol">${fmtInt(v)}<em>${seg?'seg no total':'kg×reps'}</em></span>
        ${s.dl?'<span class="tag dl-t">deload</span>':''}
        ${delta===null?'':`<span class="hs-d ${delta>0?'up':''}">${delta>0?'+':''}${delta}%</span>`}
      </div>
      <div class="hs-sets">${s.sets.map(x => x
        ? `<span>${seg ? (x[0]?fmtNum(x[0])+'kg × '+x[1]+'s':x[1]+'s')
                      : (corpo && !x[0] ? x[1]+' reps' : fmtNum(x[0])+'×'+x[1])}</span>`
        : '<span class="nul">–</span>').join('')}
        ${(seg||corpo)?'':`<span class="nul">${repsOf(s)} reps</span>`}
        ${!seg && CARGAS[tipo].dobra && maxLoad(s)?`<span class="nul">${fmtNum(totalAnilhas(maxLoad(s)))} kg ${CARGAS[tipo].total}</span>`:''}
      </div>
      ${s.dor&&s.dor.length?`<div class="pain">dor em ${s.dor.map(dorName).join(' e ')}</div>`:''}
      ${s.obs?`<div class="hs-obs">${escapeHTML(s.obs)}</div>`:''}
      <button class="edbtn" onclick="editarSessao(${real})">corrigir esta sessão</button>
    </div>`;
  }).reverse().join('');

  const dores = H.filter(x => x.dor && x.dor.length);
  if (dores.length) {
    h += `<div class="painsum"><b>${dores.length} ${dores.length===1?'sessão marcada':'sessões marcadas'} com dor de tendão</b>${H.length>1?` nas últimas ${H.length} sessões`:''}.
      A regra do programa é tirar o exercício por 2 semanas e trocar o ângulo, não empurrar por cima.</div>`;
  }

  h += `<p class="cue" style="margin:22px 0 0">${ex.cue}</p></div>`;

  app.innerHTML = h;
  window.scrollTo(0,0);
}

function openHist(i){ view.hist = { day:view.day, i, key:logKey(view.day,i) }; view.edit = null; render(); }

// ---------- correção de sessão passada ----------
// Digitou 400 no lugar de 40 e só percebeu na semana seguinte: até aqui não
// havia saída a não ser exportar o JSON e editar na mão.
function linhaEdicao(key, real, s, seg) {
  const e = S.logs[key][real];
  let rows = '';
  e.sets.forEach(function (x, k) {
    rows += `<div class="setrow">
      <div class="setno">${k+1}</div>
      <div class="f"><input type="text" inputmode="decimal" id="ed${k}_0"
        value="${x?fmtNum(x[0]):''}" placeholder="${seg?'0':'kg'}" oninput="limpaNum(this,true)"><span class="unit">kg</span></div>
      <div class="x">×</div>
      <div class="f"><input type="text" inputmode="numeric" id="ed${k}_1"
        value="${x?x[1]:''}" placeholder="${seg?'seg':'reps'}" oninput="limpaNum(this,false)">${seg?'<span class="unit">seg</span>':''}</div>
    </div>`;
  });
  return `<div class="hs editando">
    <div class="hs-top"><span class="hs-date">${fmtDate(e.t)}</span><span class="hs-vol" style="font-size:11px">corrigindo</span></div>
    <div style="margin-top:10px">${rows}</div>
    <div class="obs-h" style="margin-top:14px">dor de tendão</div>
    <div class="chips">${DORES.map(x => `<button class="chip ${(e.dor||[]).indexOf(x.k)>=0?'on':''}" onclick="editDor('${x.k}')">${x.t}</button>`).join('')}</div>
    <textarea class="note" id="edobs" placeholder="observação da sessão">${escapeHTML(e.obs||'')}</textarea>
    <div class="edrow">
      <button class="dbtn" onclick="salvarEdicao()">Salvar correção</button>
      <button class="dbtn ghost" onclick="cancelarEdicao()">cancelar</button>
    </div>
    <button class="danger" style="width:100%;margin-top:10px" onclick="apagarSessao()">apagar esta sessão</button>
  </div>`;
}

function editarSessao(real){ view.edit = real; render(); }
function cancelarEdicao(){ view.edit = null; render(); }

function editDor(k) {
  const e = S.logs[view.hist.key][view.edit];
  if (!e.dor) e.dor = [];
  const j = e.dor.indexOf(k);
  if (j >= 0) e.dor.splice(j,1); else e.dor.push(k);
  guardaCamposEdicao();
  render();
}

// preserva o que já foi digitado quando os chips forçam re-render
function guardaCamposEdicao() {
  const e = S.logs[view.hist.key][view.edit];
  e.sets.forEach(function (x, k) {
    const a = document.getElementById('ed'+k+'_0'), b = document.getElementById('ed'+k+'_1');
    if (!a || !b) return;
    const w = parseFloat(a.value.replace(',','.')), r = parseInt(b.value,10);
    e.sets[k] = isNaN(r) ? null : [isNaN(w) ? 0 : w, r];
  });
  const o = document.getElementById('edobs');
  if (o) { const t = o.value.trim(); if (t) e.obs = t; else delete e.obs; }
}

async function salvarEdicao() {
  const e = S.logs[view.hist.key][view.edit];
  guardaCamposEdicao();
  if (!e.dor || !e.dor.length) delete e.dor;
  if (!e.sets.filter(Boolean).length) {
    toast('Uma sessão sem nenhuma série. Use apagar se foi engano.');
    return;
  }
  view.edit = null;
  await save(); render();
  toast('Sessão corrigida.');
}

async function apagarSessao() {
  if (!confirm('Apagar esta sessão do histórico? Isso não tem volta.')) return;
  const key = view.hist.key;
  S.logs[key].splice(view.edit, 1);
  if (!S.logs[key].length) delete S.logs[key];
  view.edit = null;
  await save();
  if (!S.logs[key]) view.hist.key = id(view.hist.day, view.hist.i);
  render();
  toast('Sessão apagada.');
}
function histKey(k){ view.hist.key = k; view.edit = null; render(); }
function closeHist(){ const i = view.hist.i; view.hist = null; view.edit = null; view.open = i; render(); }

// ---------- cardio ----------
// Ele está em superávit. O cardio aqui é saúde cardiovascular, capacidade de
// trabalho e apetite. Nada de caloria, gasto energético, gráfico ou HIIT.
function weekStart(ts) {
  const d = new Date(ts);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6) % 7));   // segunda-feira
  return d.getTime();
}
function sameDay(a,b) {
  const x = new Date(a), y = new Date(b);
  return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate();
}
function cardioSemana() {
  const w = weekStart(Date.now());
  return S.cardio.filter(c => c.t >= w).sort((a,b) => b.t - a.t);
}
// treino de perna salvo hoje: sinaliza, não bloqueia
function pernaHoje() {
  return S.done.filter(x => (x.day==='C' || x.day==='F') && sameDay(x.t, Date.now())).map(x => x.day);
}

function renderCardio() {
  const sem = cardioSemana();
  const n = sem.length;
  const perna = pernaHoje();
  const f = view.cardioForm || { m:'bike', min:20, i:'leve' };

  let estado, cls;
  if (n < 2) { estado = n === 0 ? 'Nenhuma sessão nesta semana ainda.' : 'Falta 1 sessão para a dose mínima da semana.'; cls = ''; }
  else if (n <= 3) { estado = 'Dose da semana cumprida.'; cls = 'ok'; }
  else { estado = 'Acima da dose prescrita de 2 a 3 sessões.'; cls = 'over'; }

  return `
    <div class="hsec" style="margin:30px 0 0">cardio</div>
    <div class="week">
      <div class="week-n">${n} <em>de 3</em></div>
      <div class="week-s ${cls}">sessões nesta semana<br><b>${estado}</b></div>
    </div>
    <p class="week-p">20 minutos, 2 a 3 vezes por semana, intensidade leve a moderada — dá para conversar, sem ofegar. O cardio está aqui por saúde cardiovascular, capacidade de trabalho e regulação do apetite.</p>

    <div class="dgroup">
      <h3>Registrar sessão</h3>
      <div class="obs-h">modalidade</div>
      <div class="chips">${MODAIS.map(m => `<button class="chip ${f.m===m?'sel':''}" onclick="cardioSet('m','${m}')">${m}</button>`).join('')}</div>
      <div class="obs-h" style="margin-top:16px">duração</div>
      <div class="chips">${[15,20,25,30].map(v => `<button class="chip ${f.min===v?'sel':''}" onclick="cardioSet('min',${v})">${v} min</button>`).join('')}</div>
      <div class="obs-h" style="margin-top:16px">intensidade</div>
      <div class="chips">${['leve','moderado'].map(v => `<button class="chip ${f.i===v?'sel':''}" onclick="cardioSet('i','${v}')">${v}</button>`).join('')}</div>
      ${perna.length?`<div class="cwarn">Você salvou o treino ${perna.join(' e ')} hoje. A regra é não pôr cardio no mesmo período de treino de perna — se ainda der, deixe para outro dia.</div>`:''}
      <p class="crule">Depois da musculação ou em dia separado. Nunca antes do treino.</p>
      <button class="dbtn" onclick="addCardio()">Registrar ${f.min} min de ${f.m}</button>
    </div>

    <div class="dgroup">
      <h3>Esta semana</h3>
      ${n ? sem.map(c => `<div class="crow">
        <span class="crow-d">${fmtDate(c.t)}</span>
        <span class="crow-m">${c.m}</span>
        <span class="crow-n">${c.min} min · ${c.i}</span>

// A tela que faltava: o app sabia tudo sobre cada exercício e nada sobre o mês.
function mesRef() {
  const b = view.mes || 0;
  const d = new Date();
  d.setDate(1); d.setHours(0,0,0,0);
  d.setMonth(d.getMonth() + b);
  return d;
}

function totaisDoPeriodo(de, ate) {
  const marcas = S.done.filter(function (x) { return x.t >= de && x.t < ate; });
  let vol = 0, tempo = 0, series = 0;
  marcas.forEach(function (m) {
    const r = resumoDaSessao(m);
    vol += r.vol; series += r.series;
    tempo += m.dur || (S.sessao && S.sessao.sid === m.sid ? S.sessao.ultima - S.sessao.inicio : 0);
  });
  const dias = {};
  marcas.forEach(function (m) { dias[new Date(m.t).toDateString()] = 1; });
  return { marcas: marcas, vol: vol, tempo: tempo, series: series, dias: Object.keys(dias).length };
}

// média móvel de treinos por semana nas últimas 4 semanas fechadas.
// Deliberadamente não é sequência: você treina 5 a 6 vezes por semana, então
// sequência quebraria todo domingo e viraria cobrança em vez de informação.
function mediaSemanal() {
  const fim = weekStart(Date.now());
  const de = fim - 4*7*86400000;
  const n = S.done.filter(function (x) { return x.t >= de && x.t < fim; }).length;
  const temSemanas = S.done.some(function (x) { return x.t < fim; });
  return temSemanas ? n/4 : null;
}
