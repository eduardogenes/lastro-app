<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- user-scalable=no e maximum-scale=1: o zoom do navegador não existe aqui.
     O Safari os ignora numa aba comum, mas os respeita instalado na tela de
     início, que é o único jeito como este app é usado. O CSS (touch-action na
     raiz) e o bloqueio de gesture* cobrem o resto. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C0E0C">
<meta name="description" content="Registro de treino e comida que freia a carga no ritmo que o tendão aguenta.">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-180.png">
<!-- Três declarações de favicon porque cada motor pega uma: o SVG onde ele é
     aceito (nítido em qualquer densidade), o PNG de 32 como recuo, e o de 192
     para quem monta atalho a partir da aba. Declarados aqui, nenhum navegador
     vai pedir /favicon.ico. -->
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<title>Lastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/componentes.css">
<link rel="stylesheet" href="/src/treino.css">
<link rel="stylesheet" href="/src/protocolo.css">
<!-- A bancada: o modo de mesa. Inerte fora dela — toda regra está
     trancada atrás de [data-palco="bancada"]. Ver src/palco.js. -->
<link rel="stylesheet" href="/src/palco.css">
</head>
<body>

<div id="app"><div class="msg">Carregando seu histórico…</div></div>

<!-- role=status implica aria-live=polite: todo retorno do app passa por aqui
     ("Sincronizado", "Ajuste salvo", "Não deu para guardar a foto") e sem isto
     nada disso chega a quem usa leitor de tela. Polite e não assertive: o
     toast informa, nunca interrompe. -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- O aviso de telefone deitado. Fica no HTML e não no Preact porque não
     depende de estado nenhum: quem o liga e desliga é a media query, e assim
     ele aparece mesmo antes de o app terminar de carregar. -->
<div id="deitado" role="alert">
  <span class="ins-label">retrato</span>
  <b>Gire o telefone</b>
  <p>O app foi desenhado para uma mão, de pé, no meio de uma série. Deitado, a
     lista de carga e repetição não cabe na altura da tela.</p>
</div>

<!-- O cronômetro de descanso. Fica fora do #app de propósito: ele repinta 4×
     por segundo, e redesenhar a árvore nesse ritmo roubaria o foco do campo
     que está sendo preenchido no meio da série.
     A linha de cima diz de ONDE veio este descanso — sem ela, o número flutua
     sem referência depois de rolar a tela ou reabrir o app. -->
<div id="timer">
  <div id="tctx" class="ins-label"></div>
  <div id="tlinha">
    <div id="tval">0:00</div>
    <div id="tbar"><div id="tfill"></div></div>
    <button id="tmenos" aria-label="tirar 15 segundos do descanso">−15</button>
    <button id="tmais" aria-label="somar 15 segundos ao descanso">+15</button>
    <button id="tstop">parar</button>
  </div>
</div>

<!-- Uma entrada só. Quem decide se esta janela é o aparelho ou a BANCADA onde
     ele está pousado é o src/palco.js, e o main.jsx o importa justamente para
     que ele seja avaliado primeiro — sem depender da ordem de duas tags. -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
