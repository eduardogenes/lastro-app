<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- user-scalable=no e maximum-scale=1.
     ATENÇÃO: isto NÃO bloqueia o zoom onde o app é usado. Este comentário
     afirmava que o Safari ignora os dois numa aba comum mas "os respeita
     instalado na tela de início". O dono MEDIU em 06/10, no aparelho dele, no
     app instalado: a pinça funciona. A afirmação era falsa.
     As duas declarações ficam por decisão dele — ainda valem numa aba comum —,
     mas aqui elas são declaração sem efeito. Quem for cortar código morto: não
     corte sem perguntar, é decisão e não esquecimento.
     O que de fato impede o zoom AUTOMÁTICO (o salto do Safari ao focar campo
     menor que 16px) é a regra de 16px nos campos, em base.css. Essa funciona, e
     é ela que atende o que ele recusa. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Duas linhas, uma por tema. Um valor só deixaria a barra de status do
     sistema escura por cima de uma tela clara, no PWA instalado. -->
<meta name="theme-color" content="#E7E3DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Registro de treino e comida que freia a carga no ritmo que o tendão aguenta.">
<!-- "light dark" e não "dark": com `dark` sozinho o navegador pinta controle
     nativo e barra de rolagem em escuro mesmo no tema claro. O app passou a
     ter os dois temas, e o padrão é o do aparelho. -->
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icone-180.png">
<!-- Três declarações de favicon porque cada motor pega uma: o SVG onde ele é
     aceito (nítido em qualquer densidade), o PNG de 32 como recuo, e o de 192
     para quem monta atalho a partir da aba. Declarados aqui, nenhum navegador
     vai pedir /favicon.ico. -->
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icone-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png">
<title>Lastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/componentes.css">
<link rel="stylesheet" href="/src/treino.css">
<link rel="stylesheet" href="/src/protocolo.css">
<!-- A bancada: o modo de mesa. Inerte fora dela — toda regra está
     trancada atrás de [data-palco="bancada"]. Ver src/palco.js. -->
<link rel="stylesheet" href="/src/palco.css">
</head>
<body>

<div id="app"><div class="msg">Abrindo o registro…<br>Lendo o registro deste aparelho. Não precisa de rede.</div></div>

<!-- role=status implica aria-live=polite: todo retorno do app passa por aqui
     ("Sincronizado", "Ajuste salvo", "Não deu para guardar a foto") e sem isto
     nada disso chega a quem usa leitor de tela. Polite e não assertive: o
     toast informa, nunca interrompe. -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- A SÉRIE GUARDADA, anunciada e não mostrada.
     Hoje a confirmação de uma série é VISUAL e é boa: `voa()` anima o valor até
     a tabela, e o número aparece lá. O que falta é a metade auditiva — as 94
     chamadas de `toast()` do app não incluem nenhuma da gravação de série, e com
     a régua de repetições o `<input>` que ecoava o valor por ser campo deixa de
     existir (frente 2, R6).
     Região PRÓPRIA, e não o toast: um toast visual a cada série seriam 48
     interrupções por semana competindo com o cronômetro de descanso, que começa
     no mesmo instante. Como a confirmação visual já existe, o que falta é só o
     anúncio — então ele é invisível de propósito.
     `polite` e não `assertive`: informa, não interrompe. -->
<div id="serie-dita" role="status" aria-live="polite" class="ins-so-leitor"></div>

<!-- O aviso de telefone deitado. Fica no HTML e não no Preact porque não
     depende de estado nenhum: quem o liga e desliga é a media query, e assim
     ele aparece mesmo antes de o app terminar de carregar. -->
<div id="deitado" role="alert">
  <span class="ins-label">retrato</span>
  <b>Gire o telefone</b>
  <p>Fora do treino, o app foi desenhado de pé, para uma mão. No meio da sessão
     ele se arruma deitado também, em duas colunas.</p>
</div>

<!-- O cronômetro de descanso. Fica fora do #app de propósito: ele repinta 4×
     por segundo, e redesenhar a árvore nesse ritmo roubaria o foco do campo
     que está sendo preenchido no meio da série.
     A linha de cima diz de ONDE veio este descanso — sem ela, o número flutua
     sem referência depois de rolar a tela ou reabrir o app. -->
<div id="timer">
  <div id="tctx" class="ins-label"></div>
  <div id="tlinha">
    <div id="tval">0:00</div>
    <div id="tbar"><div id="tfill"></div></div>
    <button id="tmenos" aria-label="tirar 15 segundos do descanso">−15</button>
    <button id="tmais" aria-label="somar 15 segundos ao descanso">+15</button>
    <button id="tstop">parar</button>
  </div>
</div>

<!-- Uma entrada só. Quem decide se esta janela é o aparelho ou a BANCADA onde
     ele está pousado é o src/palco.js, e o main.jsx o importa justamente para
     que ele seja avaliado primeiro — sem depender da ordem de duas tags. -->
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
