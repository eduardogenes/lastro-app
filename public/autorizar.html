<style>
/* /autorizar: a página de consentimento do servidor OAuth do Supabase para os
   conectores do MCP (docs/mcp/00-desenho.md). Página à parte, sem o bundle do
   app: abre no Safari, fora do app instalado. Tokens da direção 3, sempre claro. */
:root {
  color-scheme: light;
  --fundo: #F6F3EC; --superficie: #FFFDF8; --quieta: #EBE6DA; --divisoria: #DFDACE; --contorno: #858073;

  --treino: #D2F23A; --refeicao: #FF9A4D; --corpo: #D3C6FF; --semana: #BBDDFB; --feito: #BEEBD2; --atencao: #FF9A4D;
  --f-titulo: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
  --f-texto: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --margem: 20px; --alvo: 44px; --mola: cubic-bezier(.2,.9,.25,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fundo); color: var(--texto); font: 400 16px/1.5 var(--f-texto); overscroll-behavior: none; }
body { min-height: 100vh; min-height: 100svh; padding: env(safe-area-inset-top, 0px) max(0px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(0px, env(safe-area-inset-left, 0px)); }
main { max-width: 440px; margin: 0 auto; padding-bottom: 40px; min-height: 100svh; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
h1, h2, p { margin: 0; }
:focus-visible { outline: 2.5px solid var(--texto); outline-offset: 3px; }
svg.i { width: 22px; height: 22px; display: block; flex: 0 0 auto; }
.marca { display: flex; align-items: center; gap: 8px; padding: 18px var(--margem) 0; font: 800 17px/1 var(--f-titulo); letter-spacing: -.02em; }
.marca i { width: 26px; height: 26px; border-radius: 8px; background: var(--texto); display: grid; place-items: center; }
.marca i::after { content: ''; width: 12px; height: 4px; border-radius: 2px; background: var(--treino); }
.topo { padding: 22px var(--margem) 0; }
.topo h1, .centro h1 { font: 800 36px/.98 var(--f-titulo); letter-spacing: -.04em; text-wrap: balance; }
.topo p { font: 500 15px/1.38 var(--f-texto); color: var(--texto-2); margin-top: 10px; text-wrap: pretty; }
.sec { padding: 18px var(--margem) 0; }
.apoio { font: 500 14px/1.4 var(--f-texto); color: var(--texto-2); margin-top: 10px; text-wrap: pretty; overflow-wrap: anywhere; }
.apoio b { color: var(--texto); }
.quem { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.cliente { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--superficie); box-shadow: inset 0 0 0 1.5px var(--divisoria); font: 600 13px/1.25 var(--f-texto); color: var(--texto-2); max-width: 100%; }
.cliente b { font: 700 15px var(--f-titulo); color: var(--texto); }
.cliente i { flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%; background: var(--corpo); display: grid; place-items: center; font: 800 14px var(--f-titulo); font-style: normal; color: var(--texto); }
.cliente span { overflow-wrap: anywhere; }
.caixa { margin-top: 12px; border-radius: 22px; box-shadow: inset 0 0 0 2px var(--texto); padding: 12px 14px; background: var(--feito); display: flex; gap: 12px; align-items: flex-start; }
.caixa p { font: 700 16px/1.25 var(--f-titulo); }
.caixa p small { display: block; font: 500 13px/1.35 var(--f-texto); margin-top: 3px; }
.caixa.erro { background: var(--atencao); }
.papeis { margin-top: 12px; border-radius: 22px; background: var(--superficie); box-shadow: inset 0 0 0 1.5px var(--divisoria); }
.papeis summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 16px; cursor: pointer; font: 700 15px/1.2 var(--f-titulo); }
.papeis summary::-webkit-details-marker { display: none; }
.papeis summary svg { width: 18px; height: 18px; transition: transform .2s var(--mola); }
.papeis[open] summary svg { transform: rotate(90deg); }
.lin { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 16px; border-top: 1.5px solid var(--divisoria); }
.lin-t { flex: 1; min-width: 0; }
.lin-t b { display: block; font: 700 15px/1.15 var(--f-titulo); }
.lin-t span { display: block; font: 500 13px/1.3 var(--f-texto); color: var(--legenda); margin-top: 2px; }
.o { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; background: var(--quieta); display: grid; place-items: center; }
.o svg { width: 20px; height: 20px; }
.o.treino { background: var(--treino); } .o.refeicao { background: var(--refeicao); } .o.semana { background: var(--semana); } .o.feito { background: var(--feito); } .o.atencao { background: var(--atencao); }
.acoes { display: flex; gap: 8px; margin-top: 18px; }
.btn { flex: 1; min-height: 58px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 18px/1 var(--f-titulo); letter-spacing: -.01em; transition: transform .15s var(--mola), opacity .15s; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn.p { background: var(--texto); color: var(--sobre-acao); }
.btn.c { flex: 0 1 auto; padding: 0 22px; box-shadow: inset 0 0 0 2px var(--texto); font-size: 16px; }
.btn.c.cheio { flex: 1; }
.saida { display: inline-flex; align-items: center; min-height: var(--alvo); font: 600 14px/1.2 var(--f-texto); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.rotulo { display: block; margin-top: 12px; font: 700 13px var(--f-texto); color: var(--texto-2); }
.campo { display: block; width: 100%; min-height: 52px; margin-top: 4px; padding: 0 14px; border-radius: 16px; border: 1.5px solid var(--contorno); background: var(--superficie); font: 500 17px var(--f-texto); color: var(--texto); }
.campo:focus-visible { outline: 2.5px solid var(--texto); outline-offset: 1px; }
.msg { margin-top: 10px; font: 600 14px/1.35 var(--f-texto); color: var(--texto); min-height: 1.35em; }
.centro { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--margem) 40px; }
.centro .o { flex: 0 0 56px; width: 56px; height: 56px; }
.centro .o svg { width: 26px; height: 26px; }
.centro h1 { margin-top: 18px; }
.centro p { font: 500 15px/1.38 var(--f-texto); color: var(--texto-2); margin-top: 10px; }
.gira { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--divisoria); border-top-color: var(--texto); animation: gira .8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
@keyframes gira { to { transform: rotate(360deg); } }
.entra { animation: entra .28s var(--mola) both; }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .gira { animation: none; } .entra { animation: none; } .btn { transition: none; } }
h1[tabindex="-1"]:focus { outline: none; }
.vis { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

      '<p class="apoio">Cada conector lê só a parte do papel dele.</p>' +
      '<p class="msg" id="msg" role="alert"></p>' +
      '<div class="acoes" style="margin-top:6px"><button class="btn p" id="sim">Permitir</button><button class="btn c" id="nao">Recusar</button></div>' +
      (conta ? '<p class="apoio">Você entrou como <b>' + esc(conta) + '</b>. <button class="saida" id="sair">Não é você? Sair</button></p>' : '') +
      '</div>');
    document.getElementById('sim').onclick = function () { decide('approve'); };
    document.getElementById('nao').onclick = function () { decide('deny'); };
    var sair = document.getElementById('sair');
    if (sair) sair.onclick = function () { guarda(null); entrar(); };
  }

  function decide(acao) {
    var sim = document.getElementById('sim'), nao = document.getElementById('nao'), m = document.getElementById('msg');
    sim.disabled = nao.disabled = true;
    (acao === 'approve' ? sim : nao).textContent = acao === 'approve' ? 'Permitindo…' : 'Recusando…';
    tokenValido().then(function (s) {
      if (!s) { entrar('A sessão expirou. Entre de novo.'); return; }
      return chama('/auth/v1/oauth/authorizations/' + encodeURIComponent(id) + '/consent', { method: 'POST', body: JSON.stringify({ action: acao }) }, s.token).then(function (r) {
        if (r.ok && r.j.redirect_url) {
          if (acao === 'approve') volta(r.j.redirect_url, 'Pronto. Pode voltar ao Claude.', 'O conector já pode ler. Se esta página não fechar sozinha, toque abaixo.');
          else {
            centro('', 'x', 'Recusado. Nada foi compartilhado.', 'O Claude recebe o aviso de que você não permitiu. Para tentar de novo, conecte outra vez no Claude.',
              '<div class="acoes"><a class="btn c cheio" href="' + esc(r.j.redirect_url) + '" style="text-decoration:none">Voltar ao Claude</a></div>');
            setTimeout(function () { location.assign(r.j.redirect_url); }, 1200);
          }
          return;
        }
        if (r.status === 404 || r.status === 400 || r.status === 410) { vencido(); return; }
        if (r.status === 401) { entrar('A sessão expirou. Entre de novo.'); return; }
        sim.disabled = nao.disabled = false; sim.textContent = 'Permitir'; nao.textContent = 'Recusar';
        m.textContent = 'Não deu para responder agora. Tente de novo.';
      });
    }, function () {
      sim.disabled = nao.disabled = false; sim.textContent = 'Permitir'; nao.textContent = 'Recusar';
      m.textContent = 'Sem conexão. Tente de novo.';
    });
  }

  function carrega() {
    if (!id) { vencido(); return; }
    tokenValido().then(function (s) {
      if (!s) { entrar(); return; }
      pinta('<div class="centro"><p><span class="gira"></span>Abrindo o pedido…</p></div>');
      return chama('/auth/v1/oauth/authorizations/' + encodeURIComponent(id), { method: 'GET' }, s.token).then(function (r) {
        if (r.status === 401) { guarda(null); entrar('A sessão expirou. Entre de novo.'); return; }
        if (!r.ok) { if (r.status >= 500) falhou(); else vencido(); return; }
        // já permitido antes, para os mesmos escopos: o Supabase aprova sozinho
        if (r.j.redirect_url && !r.j.authorization_id) {
          centro('feito', 'ok', 'Você já permitiu antes', '<span class="gira"></span>Voltando ao Claude…',
            '<a class="saida" href="' + esc(r.j.redirect_url) + '">Voltar agora</a>');
          setTimeout(function () { location.assign(r.j.redirect_url); }, 600);
          return;
        }
        mostraPedido(r.j);
      });
    }).catch(falhou);
  }

  carrega();
})();
</script>
</body>
</html>
