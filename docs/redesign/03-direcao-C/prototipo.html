<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F5F2EB">
<title>Lastro · protótipo da Direção C</title>
<style>
/* ===================== tema ===================== */
:root{
  color-scheme:light;
  --page:#E7E2D8;--paper:#F5F2EB;--card:#FFFFFF;--text:#1B1A17;--muted:#5D594F;--line:#D6CFC2;
  --ghost:#857F74;--ink:#1F3B67;--on-ink:#FFFFFF;--ink-soft:#E3E9F3;--ink-text:#1F3B67;
  --now:#B0420D;--now-soft:#FAE6D8;--warn:#7A4A00;--warn-soft:#FAEDD3;--err:#A3241A;--err-soft:#FBE6E2;
  --ok:#1E5B3A;--ok-soft:#E0EFE4;
  --hatch-c:rgba(120,113,100,.32);--scrim:rgba(20,18,14,.42);
  --hatch:repeating-linear-gradient(135deg,var(--hatch-c) 0 1.5px,transparent 1.5px 7px);
}
/* escuro: só quando o aparelho pede E o protótipo está em "automático" */
@media (prefers-color-scheme:dark){html[data-tema="auto"]{
  color-scheme:dark;
  --page:#0B0B0A;--paper:#161512;--card:#211F1B;--text:#F2EEE6;--muted:#ADA79A;--line:#3A3731;
  --ghost:#8F897D;--ink:#A9C3EE;--on-ink:#0D1A30;--ink-soft:#1F2B3F;--ink-text:#C3D6F6;
  --now:#F59A5F;--now-soft:#3A2416;--warn:#F3C277;--warn-soft:#33270F;--err:#F4978C;--err-soft:#3B1D19;
  --ok:#8FD3AA;--ok-soft:#16301F;
  --hatch-c:rgba(210,200,180,.22);--scrim:rgba(0,0,0,.6);
}}
html[data-tema="escuro"]{
  color-scheme:dark;
  --page:#0B0B0A;--paper:#161512;--card:#211F1B;--text:#F2EEE6;--muted:#ADA79A;--line:#3A3731;
  --ghost:#8F897D;--ink:#A9C3EE;--on-ink:#0D1A30;--ink-soft:#1F2B3F;--ink-text:#C3D6F6;
  --now:#F59A5F;--now-soft:#3A2416;--warn:#F3C277;--warn-soft:#33270F;--err:#F4978C;--err-soft:#3B1D19;
  --ok:#8FD3AA;--ok-soft:#16301F;
  --hatch-c:rgba(210,200,180,.22);--scrim:rgba(0,0,0,.6);
}

/* ===================== base ===================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper);color:var(--text);overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:left}
button:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{
  position:relative;width:100%;max-width:480px;margin:0 auto;
  height:100vh;height:100svh;
  background:var(--paper);display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
#stack{position:relative;flex:1;min-height:0;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.scr[hidden]{display:none}

/* faixa do protótipo (puxador) */
#grip{flex:none;height:18px;display:flex;align-items:center;justify-content:center;background:var(--paper)}
#grip span{width:38px;height:4px;border-radius:3px;background:var(--line);display:block}
#grip[aria-expanded="true"] span{background:var(--now)}

/* ===================== cabeçalhos ===================== */
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 6px;min-height:50px}
.hd .ttl{flex:1;text-align:center;line-height:1.2;min-width:0}
.hd .ttl strong{display:block;font-size:18px;letter-spacing:-.01em}
.hd .ttl span{display:block;font-size:13px;color:var(--muted)}
.back{min-height:44px;min-width:70px;padding:0 10px;color:var(--ink-text);font-weight:600;font-size:17px}
.pill{min-height:44px;min-width:62px;padding:0 13px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-size:15px;font-weight:600;text-align:center}
.arrow{width:46px;height:46px;border-radius:23px;font-size:25px;line-height:1;color:var(--ink-text);text-align:center}
.arrow[disabled]{color:var(--line)}
.spacer{width:70px;flex:none}
.stat{flex:none;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);padding:0 16px 7px}
.stat .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}

/* ===================== rolagem ===================== */
.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ===================== sessão ===================== */
.segs{flex:none;display:flex;gap:6px;padding:0 16px}
.g{display:flex;gap:2px}
.g i{flex:1;height:7px;border-radius:4px;border:1px dashed var(--ghost)}
.g i.d{background:var(--ink);border:1px solid var(--ink)}
.g i.c{background:var(--now);border:1px solid var(--now)}
.fim{flex:none;font-size:13px;color:var(--muted);padding:7px 16px 0}
.fim b{color:var(--text);font-weight:600}

.ex{padding:12px 16px 10px}
.over{font-size:13px;color:var(--muted);font-weight:600}
.ex-name{font-size:26px;line-height:1.12;letter-spacing:-.015em;margin:3px 0 4px;font-weight:700}
.ex-name.sm{font-size:19px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ex-name .ok{font-size:14px;color:var(--ink-text);font-weight:700;white-space:nowrap}
.meta{font-size:15px;color:var(--muted)}
.sets{list-style:none;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr auto;align-items:center;column-gap:8px;min-height:50px;padding:6px 12px;border-radius:12px;width:100%}
.set .n{font-weight:700;color:var(--muted);font-size:15px}
.set .v{font-weight:700;font-size:19px;display:block}
.set .s{font-size:13px;color:var(--muted);display:block}
.set .e{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.set.ink{background:var(--ink-soft);color:var(--ink-text)}
.set.ink .n,.set.ink .s,.set.ink .e{color:var(--ink-text)}
.set.cur{border:2px solid var(--now);background:var(--now-soft)}
.set.pencil{border:1.5px dashed var(--ghost);color:var(--muted)}
.set.fresh{animation:assenta .55s ease-out both}
@keyframes assenta{
  0%{background:var(--now-soft);transform:translateY(-6px)}
  60%{background:var(--now-soft);transform:none}
  100%{background:var(--ink-soft);transform:none}
}
li.wr{list-style:none}
.rir{display:flex;align-items:center;gap:5px;margin:8px 0 0;padding:0 12px 10px}
.rir>span{font-size:13px;margin-right:2px;line-height:1.15;color:var(--ink-text);font-weight:600}
.rir button{flex:1;min-width:0;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:17px;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rir button small{font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.rir button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.rir button[aria-pressed="true"] small{color:var(--on-ink)}
.rirwrap{background:var(--ink-soft);border-radius:0 0 12px 12px;margin-top:-6px;padding-top:4px}
.extra{width:100%;min-height:50px;border:1.5px dashed var(--ghost);border-radius:12px;color:var(--ink-text);font-weight:600;font-size:16px;text-align:center}
.falta{list-style:none;margin:6px 0 0;border-left:2px dashed var(--ghost);padding-left:10px}
.falta li{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);min-height:27px;align-items:center}
.falta li b{color:var(--text);font-weight:700;white-space:nowrap}
.falta li span:last-child{white-space:nowrap}

.rest{flex:none;margin:10px 16px 0;padding:9px 14px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:end;gap:6px 14px}
.rest .l{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
.rest .t{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rest .r{font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.rest .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.rest .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:3px;transition:width .9s linear}
.rest.over .t{color:var(--now)}
.rest.over .bar i{background:var(--now)}

/* área de registro, no alcance do polegar */
.entry{flex:none;margin-top:auto;padding:11px 16px 10px;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0}
.entry-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.entry-h strong{font-size:17px}
.entry-h span{font-size:14px;color:var(--muted);text-align:right}
.load{width:100%;min-height:60px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper)}
.load .lbl{font-size:14px;color:var(--muted)}
.load .kg{font-size:27px;font-weight:700;letter-spacing:-.01em}
.load .kg small{font-size:16px;font-weight:600;color:var(--muted)}
.load .same{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.reps-h{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin:11px 2px 6px;gap:8px}
.chips{display:flex;gap:6px}
.chip{flex:1;min-width:0;height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:24px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1;transition:transform .09s ease-out,background .15s}
.chip:active{transform:scale(.94)}
.chip.out{border-style:dashed;border-color:var(--ghost);color:var(--muted);font-weight:600}
.chip small{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.chip.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.sel small{color:var(--on-ink)}
.hint{font-size:14px;color:var(--muted);margin:7px 2px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.link{color:var(--ink-text);font-weight:600;min-height:44px;font-size:14px;text-decoration:underline}
.link.dang{color:var(--err)}
.cue{font-size:14px;line-height:1.35;background:var(--paper);border-left:3px solid var(--ink);padding:8px 10px;border-radius:0 10px 10px 0;margin:0 0 9px}
.nextline{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;margin:0 0 9px;padding:0 12px;border:1.5px dashed var(--ghost);border-radius:12px;font-size:15px;color:var(--muted);width:100%}
.nextline b{color:var(--text)}

/* ===================== roteiro do dia ===================== */
.known{margin:0 16px 8px;padding:9px 12px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.known-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.known-h b{font-size:16px}
.known-h .r{color:var(--muted);font-size:13px;white-space:nowrap}
.known-h .r.full{color:var(--ok);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:8px}
.cells i{height:15px;border-radius:4px;border:1px solid var(--line)}
.cells i.k{background:var(--ink);border-color:var(--ink)}
.cells i.u{background-image:var(--hatch)}
.cells i.t{outline:2px solid var(--now);outline-offset:1px}
.cells i.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.cells-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.water{margin:0 16px 8px;display:flex;align-items:center;gap:10px;min-height:56px;padding:4px 6px 4px 12px;border-radius:14px;border:1.5px dashed var(--ghost)}
.water .w1{flex:1;line-height:1.25}
.water .w1 strong{display:block;font-size:16px}
.water .w1 span{font-size:13px;color:var(--muted)}
.water.ink{border:1.5px solid transparent;background:var(--ink-soft)}
.water.ink strong,.water.ink span{color:var(--ink-text)}
.sq{min-height:46px;padding:0 15px;border-radius:12px;border:1.5px solid var(--ink);background:var(--ink);color:var(--on-ink);font-size:15px;font-weight:700;text-align:center;flex:none}
.pend{margin:0 16px 10px;padding:12px 14px;border-radius:14px;background:var(--card);border:1.5px dashed var(--ghost)}
.pend strong{display:block;font-size:16px}
.pend p{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.row-b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.btn.line{border:1.5px solid var(--line);background:var(--card);color:var(--text)}

.script{list-style:none;padding:0 16px 8px;display:flex;flex-direction:column;gap:6px}
.script>li{list-style:none}
.row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;column-gap:10px;min-height:52px;padding:7px 10px;border-radius:12px;width:100%}
.row time{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.row .w{min-width:0}
.row .w strong{display:block;font-size:16px;line-height:1.25}
.row .w span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.row .ck{font-size:17px;font-weight:700;color:var(--ink-text)}
.row .go{font-size:20px;color:var(--ink-text);font-weight:600}
.row.ink{background:var(--ink-soft)}
.row.ink time,.row.ink .w strong,.row.ink .w span{color:var(--ink-text)}
.row.pencil{border:1.5px dashed var(--ghost)}
.row.hatch{background-image:var(--hatch);border:1px solid var(--line)}
.row.hatch time,.row.hatch .w strong,.row.hatch .w span{background:var(--paper);width:fit-content;padding:0 4px;margin-left:-4px;border-radius:4px}
.row.target{border:2px solid var(--now);background:var(--now-soft)}
.row.fresh{animation:assenta .55s ease-out both}
.nowline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--now);padding:2px 0}
.nowline::before,.nowline::after{content:"";flex:1;height:2px;background:var(--now);border-radius:1px}
.open{border:2px solid var(--now);background:var(--now-soft);border-radius:12px;padding:10px 12px 12px;margin-top:-2px}
.open .itens{font-size:14px;color:var(--text);line-height:1.4;margin-top:2px}
.open .nnote{font-size:13px;color:var(--muted);margin-top:7px;padding-left:10px;border-left:3px solid var(--line);line-height:1.35}
.open .aviso{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:7px 9px;border-radius:9px;margin-top:8px;line-height:1.35}
.choice{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.open .primary{min-height:52px;font-size:17px;margin-top:10px}
.choice button{flex:1 1 42%;min-height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;color:var(--text);line-height:1.15;padding:0 6px;text-align:center}
.choice button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.follow{margin-top:10px;font-size:14px;font-weight:600}
.agora{flex:none;margin-top:auto;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:11px 16px 10px}
.agora h3{font-size:21px;line-height:1.2;margin:2px 0 4px;letter-spacing:-.01em}
.agora .items{font-size:14px;color:var(--muted);line-height:1.35}
.primary{width:100%;min-height:56px;border-radius:16px;background:var(--ink);color:var(--on-ink);font-size:18px;font-weight:700;margin-top:10px;text-align:center}
.toast{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-size:15px;line-height:1.3;animation:sobe .3s ease-out}
@keyframes sobe{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast .u{margin-left:auto;font-weight:700;text-decoration:underline;min-height:44px;padding:0 10px;color:var(--on-ink);flex:none}
.okbar{flex:none;margin-top:auto;padding:11px 16px 10px;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0}
.okbar .sl{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ink-soft);color:var(--ink-text);font-size:15px;line-height:1.35}
.okbar .sl.hatchy{background-image:var(--hatch);background-color:transparent;color:var(--text);border:1px solid var(--line)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}
.tabs button{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.tabs button::before{content:"";width:22px;height:3px;border-radius:2px;background:transparent}
.tabs button.on{color:var(--ink-text)}
.tabs button.on::before{background:var(--ink-text)}
.tabs button[aria-disabled="true"]{opacity:.38;cursor:default}

/* ===================== corpo ===================== */
.blk{margin-top:12px;padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.blk.now{border:2px solid var(--now);background:var(--now-soft)}
.blk.dash{border-style:dashed;background:transparent}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.blk-h h3{font-size:17px}
.blk-h span{font-size:13px;color:var(--muted);text-align:right}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.big small{font-size:17px;font-weight:600;color:var(--muted)}
.sub{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.sub b{color:var(--text)}
.vrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.tapval{min-height:62px;padding:5px 13px;border-radius:13px;border:1.5px dashed var(--ghost);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;background:transparent;flex:1}
.tapval.ink{border:1.5px solid transparent;background:var(--ink-soft);color:var(--ink-text)}
.tapval b{font-size:30px;font-weight:800;line-height:1}
.tapval i{font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.tapval.ink i{color:var(--ink-text)}
.wk{display:flex;gap:4px;margin-top:9px}
.wk div{flex:1;text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.wk div b{display:block;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
.wk div.bad{background-image:var(--hatch);border-radius:6px;padding:2px 0}
.wk div.bad b{color:var(--muted)}
.wk div.cur{border:2px solid var(--now);border-radius:6px;padding:2px 0}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.35}
.okb{padding:11px 12px;border-radius:13px;background:var(--ok-soft);color:var(--ok);font-size:14px;line-height:1.35;margin-top:10px}
.warnb{padding:11px 12px;border-radius:13px;background:var(--warn-soft);color:var(--warn);font-size:14px;line-height:1.35;margin-top:10px}
.warnb strong{display:block;font-size:15px;margin-bottom:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fields>*{min-height:74px;border-radius:13px;border:1.5px solid var(--line);background:var(--paper);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.fields>*.vazio{border-style:dashed;color:var(--muted);background:transparent}
.fields>* b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.fields>* span{font-size:12px;color:var(--muted);line-height:1.25}
.fields>*.cur{border:2px solid var(--now);background:var(--now-soft)}
.seg{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;margin-top:8px;font-size:14px}
.seg dt{padding:7px 0;border-top:1px solid var(--line)}
.seg dd{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ===================== teclado do app ===================== */
#kbd{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);
  padding:8px 8px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.16);
  border-radius:20px 20px 0 0;animation:sobe .22s ease-out}
#kbd[hidden]{display:none}
.kb-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px;gap:10px}
.kb-h strong{font-size:33px;font-weight:800;font-variant-numeric:tabular-nums}
.kb-h strong .un{font-size:16px;font-weight:600;color:var(--muted)}
.kb-h span{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.caret{display:inline-block;width:2px;height:27px;background:var(--ink);vertical-align:-4px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:22px;font-weight:600;text-align:center;transition:transform .09s}
.keys button:active{transform:scale(.95)}
.keys button.go{background:var(--ink);color:var(--on-ink);border-color:var(--ink);font-size:17px;font-weight:700}
.keys button.wide{grid-column:span 2}
.keys button.soft{font-size:15px;font-weight:600;color:var(--muted)}

/* ===================== folha ===================== */
#sheet{position:absolute;inset:0;z-index:7}
#sheet[hidden]{display:none}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2);
  max-height:88%;overflow-y:auto;animation:sobef .26s ease-out}
@keyframes sobef{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sh-h strong{font-size:19px}
.sh-h span{font-size:13px;color:var(--muted);text-align:right}
.sh-row{padding:12px 0;border-top:1px solid var(--line)}
.sh-row .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh-row .t1 strong{font-size:16px}
.sh-row .t1 span{font-size:13px;color:var(--muted);white-space:nowrap}
.sh-row p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.35}
.sh-act{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.sh-act .btn{flex:1 1 28%}

/* ===================== painel do protótipo ===================== */
#meta{position:absolute;left:8px;right:8px;top:22px;z-index:9;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px 13px;
  box-shadow:0 12px 34px rgba(0,0,0,.24);animation:sobe .2s ease-out}
#meta[hidden]{display:none}
#meta h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
#meta p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
.seg3{display:flex;gap:6px;margin-top:9px}
.seg3 button{flex:1;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;font-weight:600;text-align:center}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* ===================== transições ===================== */
.scr.in-f{animation:inf .24s cubic-bezier(.22,.7,.3,1) both}
.scr.in-b{animation:inb .24s cubic-bezier(.22,.7,.3,1) both}
@keyframes inf{from{transform:translateX(14%);opacity:.35}to{transform:none;opacity:1}}
@keyframes inb{from{transform:translateX(-14%);opacity:.35}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div id="app">
  <button id="grip" aria-expanded="false" aria-label="Ajustes do protótipo: tema e começar de novo" data-act="meta"><span></span></button>
  <div id="stack"></div>
  <div id="kbd" hidden></div>
  <div id="sheet" hidden></div>
  <div id="meta" hidden role="dialog" aria-label="Ajustes do protótipo"></div>
  <p class="vh" aria-live="polite" id="say"></p>
</div>

<script>
(function(){
"use strict";

/* ========================================================================
   1 · CONTEÚDO  (prescrição e plano reais; nada inventado onde há fato)
   ===================================================================== */

/* Treino A — 8 exercícios, 20 séries (01-fatos, F84) */
var EXS=[
 {n:'Chest press inclinado convergente',mus:'peito superior',pri:'secundária',np:3,rep:'6–10',alvo:[6,10],rir:'1–2',rest:180,
  ult:[{kg:50,r:9},{kg:50,r:8},{kg:50,r:8}]},
 {n:'Pulldown convergente',mus:'dorsal',pri:'secundária',np:3,rep:'6–10',alvo:[6,10],rir:'1–2',rest:150,
  ult:[{kg:60,r:8},{kg:60,r:8},{kg:60,r:7}]},
 {n:'Crucifixo inclinado no cabo',mus:'peito superior',pri:'secundária',np:2,rep:'10–15',alvo:[10,15],rir:'1',rest:120,
  ult:[{kg:12.5,r:13},{kg:12.5,r:12}]},
 {n:'Pulldown unilateral',mus:'dorsal',pri:'secundária',np:2,rep:'8–12',alvo:[8,12],rir:'1',rest:120,
  ult:[{kg:45,r:10},{kg:45,r:9}]},
 {n:'Elevação lateral na máquina',mus:'deltoide lateral',pri:'máxima',np:3,rep:'10–15',alvo:[10,15],rir:'1',rest:105,
  ult:[{kg:25,r:15},{kg:25,r:15},{kg:25,r:15}],ultRir:[1,1,1],
  sobe:'Topo nas três, com o RIR planejado. Subir no menor incremento e recomeçar perto da base.'},
 {n:'Elevação lateral unilateral no cabo',mus:'deltoide lateral',pri:'máxima',np:3,rep:'12–20',alvo:[12,20],rir:'0–1',rest:90,
  ult:[{kg:7.5,r:18},{kg:7.5,r:16},{kg:7.5,r:15}]},
 {n:'Extensão de tríceps acima da cabeça no cabo',mus:'tríceps',pri:'normal',np:2,rep:'8–12',alvo:[8,12],rir:'1',rest:120,
  ult:[{kg:20,r:11},{kg:20,r:10}]},
 {n:'Pushdown',mus:'tríceps',pri:'normal',np:2,rep:'10–15',alvo:[10,15],rir:'0–1',rest:105,
  ult:[{kg:30,r:14},{kg:30,r:12}]}
];
var ULT_DATA='21/09';

/* Plano alimentar do nutricionista — seis momentos (F181).
   Nota só onde o texto do nutricionista existe nos fatos (F182). */
var REFS=[
 {k:'pre',h:'05:45',hm:345,n:'Pré-treino',kcal:163,so:'só em dia de treino',
  itens:'pão Artesano 35 g · doce de leite 20 g · canela 1 g · café 200 ml'},
 {k:'cafe',h:'08:00',hm:480,n:'Café da manhã',kcal:629,
  itens:'cuscuz 200 g · frango 70 g · requeijão light 30 g · leite integral 250 ml · uva 120 g'},
 {k:'almoco',h:'12:30',hm:750,n:'Almoço',kcal:719,
  itens:'arroz 250 g · feijão 50 g · frango 80 g · legumes/verduras 100 g · azeite 15 g · kiwi 100 g'},
 {k:'lanche',h:'16:00',hm:960,n:'Lanche da tarde',kcal:819,
  itens:'leite 250 ml · banana 120 g · aveia 40 g · pasta de amendoim 10 g · leite em pó 10 g · whey 30 g · pão 50 g · geleia light 20 g',
  nota:'Bata leite + banana + aveia + pasta + leite em pó + whey. Pão e geleia ficam separados.'},
 {k:'jantar',h:'19:30',hm:1170,n:'Jantar',kcal:678,
  itens:'arroz 250 g · feijão 50 g · lombo suíno 80 g · legumes/verduras 100 g · azeite 15 g',
  nota:'Sem ceia obrigatória: o dia já fecha proteína e energia com quatro refeições proteicas completas.'}
];

var DIAS={
  '29':{rot:'terça, 29/09',curto:'terça',tipo:'dia de treino',sessao:true},
  '28':{rot:'segunda, 28/09',curto:'segunda',tipo:'dia de treino',aula:true}
};

/* Bioimpedância — os números que o dono listou (D2) */
var BIO=[
 {g:'Gordura',k:'gpct',n:'percentual de gordura',un:'%',dec:1},
 {g:'Gordura',k:'gkg',n:'massa de gordura',un:'kg',dec:1},
 {g:'Gordura',k:'gvis',n:'gordura visceral (nível)',un:'',dec:0},
 {g:'Gordura',k:'imc',n:'IMC ajustado',un:'',dec:1},
 {g:'Massa e água',k:'magra',n:'massa magra',un:'kg',dec:1},
 {g:'Massa e água',k:'ossea',n:'massa óssea',un:'kg',dec:1},
 {g:'Massa e água',k:'intra',n:'água intracelular',un:'l',dec:1},
 {g:'Massa e água',k:'extra',n:'água extracelular',un:'l',dec:1},
 {g:'Metabolismo',k:'basal',n:'taxa basal (kcal)',un:'',dec:0},
 {g:'Metabolismo',k:'idade',n:'idade metabólica',un:'',dec:0}
];

/* semanas de peso anteriores (domingo a sábado, F211) */
var SEMANAS=[
 {l:'06–12/09',m:72.6,n:3},
 {l:'13–19/09',m:null,n:1},
 {l:'20–26/09',m:73.1,n:2}
];
var PESO_ANT={d:'27/09',v:73.2};  /* última pesagem: domingo */

/* 14 dias da regra do nutricionista: 16/09 … 29/09.
   Os 12 primeiros são o registro que já existe; 28 e 29 saem do uso. */
var BASE14=[false,true,true,false,true,true,true,false,true,true,true,true];
var ROT14=['16/09','17/09','18/09','19/09','20/09','21/09','22/09','23/09','24/09','25/09','26/09','27/09','28/09','hoje'];

/* ========================================================================
   2 · ESTADO
   ===================================================================== */
var KEY='lastro.protoC.v1';
var ST=null, clockBase=0, wallBase=0, tick=null;

function novo(){
  var exs=EXS.map(function(e,i){
    var s=[];
    for(var j=0;j<e.np;j++) s.push({feita:false,kg:null,r:null,rir:null,extra:false,t:null});
    return {s:s};
  });
  /* o que já saiu hoje, até a 9ª série; t em segundos do relógio do protótipo */
  exs[0].s[0]={feita:true,kg:50,r:10,rir:1,extra:false,t:23100};   /* 6:25 */
  exs[0].s[1]={feita:true,kg:50,r:9,rir:1,extra:false,t:23340};
  exs[0].s[2]={feita:true,kg:50,r:8,rir:2,extra:false,t:23580};
  exs[1].s[0]={feita:true,kg:60,r:9,rir:1,extra:false,t:23820};
  exs[1].s[1]={feita:true,kg:60,r:8,rir:1,extra:false,t:24000};
  exs[1].s[2]={feita:true,kg:60,r:8,rir:2,extra:false,t:24180};
  exs[2].s[0]={feita:true,kg:12.5,r:14,rir:1,extra:false,t:24360};
  exs[2].s[1]={feita:true,kg:12.5,r:13,rir:1,extra:false,t:24540};
  exs[3].s[0]={feita:true,kg:45,r:11,rir:1,extra:false,t:24820};   /* 6:53:40 */
  return {
    tema:'claro',
    clock:6*3600+55*60,
    tela:'sessao',
    dia:'29',
    sess:{aberta:true,inicio:'6:20',exs:exs,corrigindo:null,kgTmp:null},
    dias:{
      '29':{ref:{},agua:null,peso:null},
      '28':{ref:{},agua:null,peso:null}
    },
    pesos:{'29':null},
    bio:{},
    pendOnte:true,
    toast:null,
    flash:null,
    flashCell:null
  };
}
function load(){
  var raw=null;
  try{raw=window.localStorage.getItem(KEY);}catch(e){raw=null;}
  if(raw){ try{ var o=JSON.parse(raw); if(o&&o.sess&&o.dias){return o;} }catch(e){} }
  return novo();
}
function save(){
  try{ ST.clock=Math.round(agora()); window.localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){}
}

/* relógio do protótipo: parte de 6:55 e anda com o tempo real;
   congela enquanto o arquivo está fechado */
function agora(){ return clockBase + (Date.now()-wallBase)/1000; }
function hhmm(s){
  s=Math.floor(s)%86400; var h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h+':'+(m<10?'0':'')+m;
}
function mmss(s){
  s=Math.max(0,Math.floor(s)); var m=Math.floor(s/60), g=s%60;
  return m+':'+(g<10?'0':'')+g;
}
function kgf(v){
  if(v===null||v===undefined) return '—';
  var s=(Math.round(v*10)/10).toFixed(1).replace('.',',');
  return s.replace(/,0$/,'');
}
function dec2(v){ return v===null||v===undefined?'—':(Math.round(v*100)/100).toFixed(2).replace('.',','); }
function dec1(v){ return v===null||v===undefined?'—':(Math.round(v*10)/10).toFixed(1).replace('.',','); }

/* ========================================================================
   3 · CONTAS DA SESSÃO
   ===================================================================== */
function cursor(){
  var E=ST.sess.exs;
  for(var i=0;i<E.length;i++) for(var j=0;j<E[i].s.length;j++) if(!E[i].s[j].feita) return {ex:i,set:j};
  return null;
}
function feitasPrescritas(){
  var c=0,E=ST.sess.exs;
  for(var i=0;i<E.length;i++) for(var j=0;j<E[i].s.length;j++) if(E[i].s[j].feita&&!E[i].s[j].extra) c++;
  return c;
}
function restaSeg(){
  var E=ST.sess.exs,t=0;
  for(var i=0;i<E.length;i++) for(var j=0;j<E[i].s.length;j++) if(!E[i].s[j].feita) t+=EXS[i].rest+45;
  return t;
}
function ultimaFeita(){
  var E=ST.sess.exs,best=null;
  for(var i=0;i<E.length;i++) for(var j=0;j<E[i].s.length;j++){
    var s=E[i].s[j]; if(s.feita&&s.t!==null&&(best===null||s.t>=best.t)) best={ex:i,set:j,t:s.t};
  }
  return best;
}
function refSet(ex,set){                       /* referência da última sessão */
  var u=EXS[ex].ult; return u[Math.min(set,u.length-1)];
}

/* ========================================================================
   4 · CONTAS DA COMIDA / CORPO
   ===================================================================== */
function valoresDia(d){ var o=ST.dias[d].ref,a=[],k; for(k in o) if(o[k]) a.push(o[k]); return a; }
function conhecido(d){
  var v=valoresDia(d);
  if(v.indexOf('naosei')>=0) return false;
  return v.length>0;
}
function conta14(){
  var c=0,i;
  for(i=0;i<12;i++) if(BASE14[i]) c++;
  if(conhecido('28')) c++;
  if(conhecido('29')) c++;
  return c;
}
function cell14(i){
  if(i<12) return BASE14[i]?'k':'u';
  var d=(i===12)?'28':'29';
  return conhecido(d)?'k':'u';
}
function pesoSemana(){
  var hj=ST.pesos['29'], vals=[PESO_ANT.v];
  if(hj!==null&&hj!==undefined) vals.push(hj);
  var soma=vals.reduce(function(a,b){return a+b;},0);
  return {n:vals.length,media:soma/vals.length};
}

/* ========================================================================
   5 · PEDAÇOS DE TELA
   ===================================================================== */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function a(act,extra){ return 'data-act="'+act+'"'+(extra?' '+extra:''); }

function tabs(on){
  return '<nav class="tabs" aria-label="Lugares">'+
    '<button class="'+(on==='hoje'?'on':'')+'" '+a('ir:hoje')+'>Hoje</button>'+
    '<button aria-disabled="true" '+a('nada')+'>Semanas</button>'+
    '<button aria-disabled="true" '+a('nada')+'>Prescrição</button>'+
  '</nav>';
}

/* ---------- chips de repetição ---------- */
function chips(ref,alvo,sel,act){
  var h='<div class="chips" role="group" aria-label="Repetições">',i,v;
  for(i=-3;i<=3;i++){
    v=ref+i; if(v<1) continue;
    var fora=(v<alvo[0]||v>alvo[1]);
    var cls='chip'+(fora?' out':'')+(sel===v?' sel':'');
    var tag = (sel===v)?'<small>gravado</small>' : (i===0?'<small>última</small>':'');
    h+='<button class="'+cls+'" '+a(act+':'+v)+' aria-label="'+v+' repetições, '+(sel?'corrigir':'gravar')+'">'+v+tag+'</button>';
  }
  return h+'</div>';
}

/* ========================================================================
   6 · TELA DA SESSÃO
   ===================================================================== */
function telaSessao(){
  var cur=ST.sess.corrigindo||cursor();
  var corr=!!ST.sess.corrigindo;
  var E=ST.sess.exs;
  var feitas=feitasPrescritas();
  var uf=ultimaFeita();
  var rest=uf?Math.max(0,agora()-uf.t):0;
  var h='';
  /* o foco (a metade de cima) anda um passo atrás do cursor: o exercício que
     acabou de fechar fica à vista enquanto o descanso corre, para a série extra
     continuar ao alcance; a metade de baixo já oferece o próximo. */
  var foco, aSeguir=false;
  if(corr) foco=cur.ex;
  else if(cur&&uf&&uf.ex!==cur.ex&&E[uf.ex].s.every(function(x){return x.feita;})){ foco=uf.ex; aSeguir=true; }
  else if(cur) foco=cur.ex;
  else foco=E.length-1;

  /* cabeçalho */
  var sub = cur? ('desde '+ST.sess.inicio+' · '+(E[cur.ex].s[cur.set]&&E[cur.ex].s[cur.set].extra?'série extra':'série '+(feitas+1)+' de 20'))
               : ('desde '+ST.sess.inicio+' · 20 de 20');
  h+='<div class="hd">'+
      '<button class="back" '+a('ir:hoje')+'>‹ Hoje</button>'+
      '<div class="ttl"><strong>Treino A</strong><span class="num">'+sub+'</span></div>'+
      '<button class="pill" '+a('folha')+'>Dia</button>'+
     '</div>';
  h+='<p class="stat"><span class="dot"></span><span class="num">'+hhmm(agora())+'</span> · sem rede · tudo gravado neste aparelho</p>';

  /* barra das 20 séries */
  h+='<div class="segs" role="img" aria-label="'+feitas+' de 20 séries feitas">';
  for(var i=0;i<E.length;i++){
    h+='<span class="g" style="flex:'+EXS[i].np+'">';
    for(var j=0;j<E[i].s.length;j++){
      var s=E[i].s[j];
      var k=s.feita?'d':((cur&&cur.ex===i&&cur.set===j)?'c':'');
      h+='<i'+(k?' class="'+k+'"':'')+'></i>';
    }
    h+='</span>';
  }
  h+='</div>';

  /* fim previsto · pela prescrição, com e sem o cardio de hoje */
  var fimTxt='';
  if(cur){
    var fim=agora()+restaSeg();
    fimTxt='fim <b class="num">~'+hhmm(fim)+'</b> · com cardio <b class="num">~'+hhmm(fim+23*60)+'</b>';
  }

  /* descanso — conta para cima, pelo relógio do aparelho */
  if(uf&&cur){
    var pres=EXS[uf.ex].rest, pct=Math.min(100,Math.round(rest/pres*100)), over=rest>pres;
    h+='<div class="rest'+(over?' over':'')+'" role="group" aria-label="Descanso">'+
        '<div><span class="l">Descanso</span><span class="t num">'+mmss(rest)+'</span></div>'+
        '<div class="r"><span class="rl">'+(over?'passou do lembrete · volte quando der':'lembrete aos '+mmss(pres)+' · pelo relógio')+'</span><br><span class="fimx">'+fimTxt+'</span></div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
       '</div>';
  }else if(cur){
    h+='<p class="fim">Fim previsto pela prescrição · '+fimTxt+'</p>';
  }

  /* corpo rolável: exercício da vez + o que falta */
  h+='<div class="scroll" data-sc="sessao"><section class="ex">';
  if(cur||foco!==null){
    var ex=EXS[foco], st=E[foco];
    var completo = st.s.every(function(x){return x.feita;});
    var nExtras = st.s.filter(function(x){return x.extra;}).length;
    h+='<p class="over">'+(foco+1)+' de 8 · '+ex.mus+' · prioridade '+ex.pri+'</p>';
    if(completo){
      h+='<h3 class="ex-name sm">'+esc(ex.n)+' <span class="ok">'+ex.np+(nExtras?' + '+nExtras+' extra':' de '+ex.np)+' ✓</span></h3>';
    }else{
      h+='<h3 class="ex-name">'+esc(ex.n)+'</h3>'+
         '<p class="meta">'+ex.np+' × '+ex.rep+' · RIR '+ex.rir+' · descanso '+mmss(ex.rest)+' · carga na máquina</p>';
    }
    h+='<ol class="sets">';
    for(var j2=0;j2<st.s.length;j2++){
      var s2=st.s[j2], atual=(cur&&cur.ex===foco&&cur.set===j2);
      var fresh=(ST.flash==='set-'+foco+'-'+j2)?' fresh':'';
      if(s2.feita){
        var rr=refSet(foco,j2), delta=s2.r-rr.r;
        var nota=(s2.rir!==null?'RIR '+s2.rir+' · ':'')+(s2.extra?'extra, só hoje':(delta>0?'+'+delta+' rep vs última':delta<0?delta+' rep vs última':'igual à última'));
        h+='<li class="wr"><button class="set ink'+fresh+'" '+a('corrigir:'+foco+':'+j2)+
            ' aria-label="Série '+(j2+1)+': '+kgf(s2.kg)+' quilos por '+s2.r+' repetições. Tocar para corrigir">'+
            '<span class="n">'+(j2+1)+'</span><span><span class="v num">'+kgf(s2.kg)+' × '+s2.r+'</span><span class="s">'+nota+'</span></span>'+
            '<span class="e">'+(corr&&atual?'corrigindo ✎':'gravada ✎')+'</span></button>';
        /* RIR na própria linha, durante o descanso */
        if(!corr && uf && uf.ex===foco && uf.set===j2){
          h+='<div class="rirwrap"><div class="rir" role="group" aria-label="RIR desta série, opcional"><span>RIR?<br><span style="font-weight:500">opcional</span></span>';
          for(var v=0;v<=4;v++){
            h+='<button '+a('rir:'+foco+':'+j2+':'+v)+' aria-pressed="'+(s2.rir===v)+'">'+v+(v===1?'<small>alvo</small>':'')+'</button>';
          }
          h+='</div></div>';
        }
        h+='</li>';
      }else if(atual){
        var rf=refSet(foco,j2);
        h+='<li class="wr"><div class="set cur"><span class="n">'+(j2+1)+'</span><span><span class="v">agora'+(s2.extra?' · extra':'')+'</span>'+
            '<span class="s num">'+(s2.extra?'só hoje · '+ex.np+' → '+st.s.length+' séries':'última ('+ULT_DATA+'): '+kgf(rf.kg)+' × '+rf.r)+'</span></span><span class="e"></span></div></li>';
      }else{
        h+='<li class="wr"><div class="set pencil"><span class="n">'+(j2+1)+'</span><span><span class="v" style="font-weight:600">previsto</span><span class="s">'+ex.rep+'</span></span><span class="e"></span></div></li>';
      }
    }
    /* série além da prescrição */
    if(completo&&!corr){
      h+='<li class="wr"><button class="extra" '+a('extra:'+foco)+'>+ '+(st.s.length+1)+'ª série, além da prescrição</button></li>';
    }
    h+='</ol>';

    /* o que falta, com a prioridade do treinador */
    if(!aSeguir&&cur){
      var falta=[];
      for(var q=foco+1;q<EXS.length;q++){
        var pend=E[q].s.filter(function(x){return !x.feita;}).length;
        if(pend) falta.push({i:q,n:pend});
      }
      if(falta.length){
        h+='<p class="over" style="margin-top:14px">Falta, com a prioridade do treinador</p><ol class="falta">';
        falta.forEach(function(f){
          var mx=EXS[f.i].pri==='máxima';
          h+='<li><span>'+(f.i+1)+' · '+esc(EXS[f.i].n)+'</span>'+(mx?'<b>':'<span>')+f.n+' · '+EXS[f.i].pri+(mx?'</b>':'</span>')+'</li>';
        });
        h+='</ol>';
      }
    }
    if(!cur){
      h+='<p class="meta" style="margin-top:14px">20 de 20 séries. A sessão fechou sozinha na última série gravada: encerrar não é obrigação, e o fim se confirma na próxima abertura.</p>';
    }
  }
  h+='</section></div>';

  /* ---------- área de registro ---------- */
  h+='<section class="entry" aria-label="Registrar">';
  if(!cur){
    h+='<div class="entry-h"><strong>Sessão completa</strong><span class="num">20 de 20</span></div>'+
       '<button class="primary" '+a('ir:hoje')+'>Voltar para o dia</button>';
  }else{
    var exC=EXS[cur.ex], sC=E[cur.ex].s[cur.set];
    var primeiraDoEx=(cur.set===0&&!E[cur.ex].s.some(function(x){return x.feita;}));
    var ref=refSet(cur.ex,cur.set);
    var kgBase = (ST.sess.kgTmp!==null&&ST.sess.kgTmp!==undefined)?ST.sess.kgTmp
               : (corr?sC.kg : (sC.extra? E[cur.ex].s[cur.set-1].kg : ref.kg));
    var repRef = corr?sC.r : (sC.extra? E[cur.ex].s[cur.set-1].r : ref.r);

    if(corr){
      h+='<div class="entry-h"><strong>Corrigir a série '+(cur.set+1)+'</strong><span class="num">gravada: '+kgf(sC.kg)+' × '+sC.r+'</span></div>';
    }else{
      /* a série extra recolhe o próximo numa linha, para ficar no lugar do polegar */
      if(sC.extra&&cur.ex+1<EXS.length){
        h+='<div class="nextline"><span>A seguir: <b>'+esc(EXS[cur.ex+1].n)+'</b></span><span>›</span></div>';
      }
      if(primeiraDoEx){
        h+='<p class="over">'+(aSeguir?'A seguir · ':'')+(cur.ex+1)+' de 8 · '+exC.mus+' · prioridade '+exC.pri+'</p>';
        if(aSeguir){
          h+='<div class="entry-h"><strong>'+esc(exC.n)+'</strong><span class="num">'+exC.np+' × '+exC.rep+' · '+mmss(exC.rest)+'</span></div>';
        }
        /* convite de subir carga: só quando o RIR planejado foi cumprido */
        if(exC.sobe){
          h+='<p class="cue">Na última ('+ULT_DATA+'): <b class="num">'+kgf(exC.ult[0].kg)+' × '+exC.ult.map(function(u){return u.r;}).join(' · ')+'</b>, RIR '+exC.ultRir.join(' · ')+'. '+esc(exC.sobe)+'</p>';
        }
      }
      h+='<div class="entry-h"><strong>'+(sC.extra?'Série '+(cur.set+1)+' · extra':'Série '+(cur.set+1)+' de '+exC.np)+' · como saiu?</strong>'+
         '<span class="num">alvo '+exC.rep+'</span></div>';
    }

    var sameTxt = corr?'mudar ✎' : (sC.extra?'como a<br>série '+cur.set+' ✎' : (primeiraDoEx&&exC.sobe?'última ·<br>subir ✎':'igual à<br>última ✎'));
    h+='<button class="load" '+a('carga')+' aria-label="Carga '+kgf(kgBase)+' quilos. Tocar para mudar">'+
        '<span class="lbl">Carga</span><span class="kg num">'+kgf(kgBase)+'<small> kg</small></span>'+
        '<span class="same">'+sameTxt+'</span></button>';
    h+='<div class="reps-h"><span>Repetições · um toque '+(corr?'corrige':'grava')+'</span><span class="num">'+(corr?'':'última: '+repRef)+'</span></div>';
    h+=chips(repRef,exC.alvo,corr?sC.r:null,'reg:'+cur.ex+':'+cur.set);
    if(corr){
      h+='<div class="hint" style="justify-content:space-between"><button class="link" '+a('cancelar')+'>Cancelar</button>'+
         '<button class="link dang" '+a('apagar:'+cur.ex+':'+cur.set)+'>Apagar esta série</button></div>';
    }else{
      h+='<p class="hint"><button class="link" '+a('outro')+'>Outro número</button><span>· o RIR vem depois, se quiser</span></p>';
    }
  }
  h+='</section>';
  return h;
}

/* ========================================================================
   7 · TELA DO DIA (Hoje / um dia passado)
   ===================================================================== */
function linhaRef(d,r,aberta){
  var val=ST.dias[d].ref[r.k]||null;
  var hoje=(d==='29');
  var cl=agora();
  var passou = !hoje || cl > r.hm*60;
  var fresh=(ST.flash==='ref-'+d+'-'+r.k)?' fresh':'';
  var estado;
  if(val==='tudo') estado='tudo · '+r.kcal+' kcal';
  else if(val==='metade') estado='metade · porção 0,5';
  else if(val==='sei') estado='saiu do plano, sabendo o que comeu';
  else if(val==='naosei') estado='saiu do plano, sem saber quanto';
  else if(val==='nada') estado='não comi · declarado';
  else estado = passou?('sem marca · '+r.kcal+' kcal'):('previsto · '+r.kcal+' kcal');
  var cls = val?(val==='naosei'?'hatch':'ink') : (passou?'hatch':'pencil');
  var h='<li>';
  h+='<button class="row '+cls+fresh+'" '+a('ref:'+d+':'+r.k)+' aria-expanded="'+(aberta?'true':'false')+'">'+
      '<time>'+r.h+'</time><span class="w"><strong>'+r.n+'</strong><span>'+estado+'</span></span>'+
      (val?'<span class="ck">✓</span>':'<span class="go">›</span>')+'</button>';
  if(aberta){
    h+='<div class="open" role="group" aria-label="'+r.n+'">';
    h+='<p class="itens">'+esc(r.itens)+'</p>';
    if(r.nota) h+='<p class="nnote">“'+esc(r.nota)+'” — nutricionista</p>';
    if(!passou) h+='<p class="aviso">Previsto para as '+r.h+'. Marcar antes grava como comido, com a hora do toque.</p>';
    /* o caso comum é um toque; os outros degraus ficam um toque abaixo */
    h+='<button class="primary" '+a('marcar:'+d+':'+r.k+':tudo')+' aria-pressed="'+(val==='tudo')+'">'+
       (val==='tudo'?'✓ Comi tudo':'Comi tudo')+'</button>';
    h+='<div class="choice">';
    [['metade','Metade'],['sei','Outra coisa, e sei'],['naosei','Outra coisa, e não sei'],['nada','Não comi']].forEach(function(o){
      h+='<button '+a('marcar:'+d+':'+r.k+':'+o[0])+' aria-pressed="'+(val===o[0])+'">'+o[1]+'</button>';
    });
    h+='</div>';
    if(val) h+='<p class="follow">Tocar de novo muda. Não há prazo.</p>';
    else h+='<p class="follow" style="font-weight:500;color:var(--muted);font-size:13px">“Não sei quanto” tira o dia inteiro da conta dos 14.</p>';
    h+='</div>';
  }
  return h+'</li>';
}

function telaDia(){
  var d=ST.dia, D=DIAS[d], hoje=(d==='29');
  var cl=agora();
  var h='';
  h+='<div class="hd">'+
      (hoje?'<button class="arrow" '+a('dia:28')+' aria-label="Dia anterior">‹</button>'
           :'<button class="back" '+a('dia:29')+'>‹ Hoje</button>')+
      '<div class="ttl"><strong>'+(hoje?'Hoje':'Segunda, 28/09')+'</strong><span>'+(hoje?D.rot+' · '+D.tipo:'de memória · cada toque grava')+'</span></div>'+
      (hoje?'<button class="arrow" disabled aria-label="Dia seguinte">›</button>':'<span class="spacer"></span>')+
     '</div>';

  h+='<div class="scroll" data-sc="dia-'+d+'">';

  /* regra do nutricionista: 11 de 14 dias conhecidos */
  var c14=conta14(), full=c14>=11;
  h+='<div class="known">'+
      '<div class="known-h"><span>Comida conhecida em <b class="num">'+c14+' de 14</b> dias</span>'+
      '<span class="r'+(full?' full':'')+'">'+(full?'a regra já tem os 11':'a regra pede 11')+'</span></div>'+
      '<div class="cells" role="img" aria-label="Últimos 14 dias: '+c14+' conhecidos">';
  for(var i=0;i<14;i++){
    var k=cell14(i), ex=(i===13?' t':'')+(ST.flashCell===i?' pop':'');
    h+='<i class="'+k+ex+'" title="'+ROT14[i]+'"></i>';
  }
  h+='</div><div class="cells-l"><span>16/09</span><span>hoje</span></div></div>';

  /* pendência de ontem, só em Hoje */
  if(hoje&&ST.pendOnte&&!conhecido('28')){
    h+='<div class="pend" role="region" aria-label="Pendência">'+
        '<strong>Ontem, segunda, ficou sem marca de comida</strong>'+
        '<p>Nenhuma refeição marcada em 28/09. O dia ainda entra na conta dos 14 — e hoje faltam '+(11-conta14())+' para a regra voltar a ter o que precisa.</p>'+
        '<div class="row-b"><button class="btn solid" '+a('dia:28')+'>Completar ontem</button>'+
        '<button class="btn line" '+a('pendnao')+'>Mais tarde</button></div></div>';
  }

  /* água */
  var ag=ST.dias[d].agua;
  h+='<div class="water'+(ag?' ink':'')+'">'+
      '<div class="w1"><strong>Água · '+(ag?ag+(ag===1?' copo':' copos'):'sem conta')+'</strong>'+
      '<span>'+(ag?'de 14':'meta: 14 copos de 250 ml · sem conta não é zero')+'</span></div>'+
      '<button class="sq" '+a('agua:'+d)+' aria-label="Mais um copo de água">+1 copo</button></div>';

  /* roteiro em ordem de hora */
  h+='<ol class="script">';
  var postos=false;
  function talvezAgora(hm){
    if(!hoje||postos) return '';
    if(cl < hm*60){ postos=true; return '<li class="nowline">agora '+hhmm(cl)+'</li>'; }
    return '';
  }

  /* cardio: previsto depois do treino A (F46) */
  if(hoje){
    h+='<li><div class="row pencil"><time>após</time><span class="w"><strong>Cardio depois do A</strong>'+
       '<span>previsto · 20 a 25 min, leve a moderado</span></span><span></span></div></li>';
  }else{
    h+='<li><div class="row ink"><time>manhã</time><span class="w"><strong>Aula de HYROX · fui</strong>'+
       '<span>6ª da sequência · marcada no dia, 7:41</span></span><span class="ck">✓</span></div></li>';
  }

  /* refeições + sessão, em ordem */
  REFS.forEach(function(r){
    h+=talvezAgora(r.hm);
    h+=linhaRef(d,r,ST.refAberta===d+':'+r.k);
    /* a sessão aberta mora entre o pré-treino e o café */
    if(r.k==='pre'&&hoje){
      h+='<li><button class="row target" '+a('ir:sessao')+'>'+
         '<time>06:20</time><span class="w"><strong>Treino A · em andamento</strong>'+
         '<span class="num">série '+(feitasPrescritas()+1)+' de 20 · desde 6:20</span></span><span class="go">›</span></button></li>';
    }
  });
  h+=talvezAgora(24*60);

  /* peso do dia → leva ao Corpo */
  var pz=(d==='29')?ST.pesos['29']:null;
  if(hoje){
    h+='<li><button class="row '+(pz!==null&&pz!==undefined?'ink':'pencil')+'" '+a('ir:corpo')+'>'+
       '<time>—</time><span class="w"><strong>Peso de hoje</strong>'+
       '<span>'+(pz!==null&&pz!==undefined?dec1(pz)+' kg · gravado neste aparelho':'previsto · a regra pede 3 a 4 por semana')+'</span></span>'+
       (pz!==null&&pz!==undefined?'<span class="ck">✓</span>':'<span class="go">›</span>')+'</button></li>';
  }else{
    h+='<li><div class="row hatch"><time>—</time><span class="w"><strong>Peso</strong><span>sem pesagem em 28/09</span></span><span></span></div></li>';
  }
  h+='</ol>';
  h+='</div>'; /* scroll */

  /* pé da tela */
  if(hoje){
    var uf=ultimaFeita(), rest=uf?Math.max(0,agora()-uf.t):0;
    h+='<section class="agora" aria-label="Agora">';
    if(ST.toast) h+='<div class="toast" role="status">'+esc(ST.toast)+'<button class="u" '+a('desfazer')+'>Desfazer</button></div>';
    if(cursor()){
      h+='<p class="over">Agora · sessão aberta, nada se perdeu</p>'+
         '<h3>Treino A · série '+(feitasPrescritas()+1)+' de 20</h3>'+
         '<p class="items">'+esc(EXS[cursor().ex].n)+' · descanso <span class="num">'+mmss(rest)+'</span>, contando pelo relógio do aparelho</p>'+
         '<button class="primary" '+a('ir:sessao')+'>Voltar para a série</button>';
    }else{
      h+='<p class="over">Agora · próximo previsto</p><h3>Cardio depois do A</h3>'+
         '<p class="items">20 a 25 min, leve a moderado. A sessão de hoje fechou na última série.</p>';
    }
    h+='</section>';
  }else{
    var con=conhecido('28'), v=valoresDia('28');
    h+='<section class="okbar" aria-label="Resultado do dia">';
    if(ST.toast) h+='<div class="toast" role="status" style="margin-bottom:10px">'+esc(ST.toast)+'<button class="u" '+a('desfazer')+'>Desfazer</button></div>';
    h+='<div class="sl'+(con?'':' hatchy')+'"><span class="ck">'+(con?'✓':'·')+'</span><span>'+
        (con?'<b>Segunda conta para a regra.</b> Dia conhecido: '+(v.indexOf('sei')>=0?'saiu do plano, sabendo o que comeu':'seguiu o plano no que foi marcado')+'.'
            :'<b>Segunda ainda não conta.</b> Sem nenhuma marca, o dia fica não sabido — que não é o mesmo que não comido.')+
        '</span></div>'+
       '<div class="row-b"><button class="btn solid" style="flex:1" '+a('dia:29')+'>Voltar para hoje</button></div></section>';
  }
  h+=tabs('hoje');
  return h;
}

}

/* ========================================================================
   9 · TELA DA BIOIMPEDÂNCIA
   ===================================================================== */
function telaBio(){
  var h='';
  h+='<div class="hd"><button class="back" '+a('ir:corpo')+'>‹ Corpo</button>'+
     '<div class="ttl"><strong>Bioimpedância</strong><span>29/09 · 1ª do mês</span></div><span class="spacer"></span></div>';
  h+='<div class="scroll" data-sc="bio" style="padding:4px 16px 14px">';
  var grupo=null;
  BIO.forEach(function(f,i){
    if(f.g!==grupo){
      if(grupo!==null) h+='</div>';
      grupo=f.g;
      h+='<p class="over" style="margin-top:14px">'+grupo+'</p><div class="fields">';
    }
    var v=ST.bio[f.k];
    var vazio=(v===undefined||v===null);
    var cur=(ST.bioCampo===f.k);
    h+='<button class="'+(vazio?'vazio':'')+(cur?' cur':'')+'" '+a('bio:'+f.k)+' aria-label="'+f.n+(vazio?', vazio':', '+v)+'. Tocar para pôr o número">'+
       '<b class="num">'+(vazio?'—':(f.dec?dec1(v):v)+(f.un?' '+f.un:''))+'</b><span>'+f.n+'</span></button>';
  });
  h+='</div>';
  h+='<p class="over" style="margin-top:14px">Por segmento · opcional</p>'+
     '<dl class="seg">'+
     ['Braço direito','Braço esquerdo','Tronco','Perna direita','Perna esquerda'].map(function(s){
       return '<dt>'+s+'</dt><dd>— kg</dd><dd>— %</dd>';
     }).join('')+'</dl>';
  h+='<p class="note">Vazio fica vazio, nunca zero: balança que não dá um número deixa o campo em branco. Nada aqui é calculado a partir dos outros, e não há tendência com dois pontos — a comparação começa a valer no terceiro mês.</p>';
  h+='</div>';
  return h;
}

/* ========================================================================
   10 · FOLHA "DIA" SOBRE A SESSÃO
   ===================================================================== */
function folhaDia(){
  var uf=ultimaFeita(), rest=uf?Math.max(0,agora()-uf.t):0;
  var pre=ST.dias['29'].ref.pre||null, ag=ST.dias['29'].agua, pz=ST.pesos['29'];
  var h='<div class="scrim" '+a('fecharfolha')+'></div><div class="pane" role="dialog" aria-label="O dia, sem sair da sessão">'+
    '<div class="grab"></div>'+
    '<div class="sh-h"><strong>Terça, 29/09</strong><span class="num">descanso '+mmss(rest)+' · contando</span></div>';
  h+='<div class="sh-row"><div class="t1"><strong>Pré-treino · 05:45</strong><span>'+(pre?(pre==='tudo'?'tudo':pre==='metade'?'metade':'saiu do plano'):'sem marca')+'</span></div>'+
     '<p>pão Artesano 35 g · doce de leite 20 g · canela 1 g · café 200 ml</p>'+
     '<div class="sh-act"><button class="btn '+(pre==='tudo'?'solid':'line')+'" '+a('marcarf:pre:tudo')+'>Comi tudo</button>'+
     '<button class="btn '+(pre==='metade'?'solid':'line')+'" '+a('marcarf:pre:metade')+'>Metade</button>'+
     '<button class="btn line" '+a('ir:hoje')+'>No dia ›</button></div></div>';
  h+='<div class="sh-row"><div class="t1"><strong>Água</strong><span>meta: 14 copos de 250 ml</span></div>'+
     '<div class="sh-act"><button class="btn line" style="flex:none;min-width:56px;text-align:center" '+a('aguamenos:29')+' aria-label="Tirar um copo">−</button>'+
     '<div style="flex:1;text-align:center;font-size:21px;font-weight:700" class="num">'+(ag?ag+(ag===1?' copo':' copos'):'sem conta')+'</div>'+
     '<button class="btn solid" style="flex:none" '+a('agua:29')+'>+1 copo</button></div></div>';
  h+='<div class="sh-row" style="border-bottom:1px solid var(--line)"><div class="t1"><strong>Peso de hoje</strong><span>'+((pz!==null&&pz!==undefined)?dec1(pz)+' kg':'ainda não')+'</span></div>'+
     '<p>da balança de casa, de manhã, antes do treino</p>'+
     '<div class="sh-act"><button class="btn line" style="flex:1" '+a('ir:corpo')+'>'+((pz!==null&&pz!==undefined)?'Ver no Corpo ›':'Registrar o peso ›')+'</button></div></div>';
  h+='<p class="note" style="text-align:center;margin-top:12px">A sessão continua aberta atrás desta folha.</p>';
  return h+'</div>';
}

/* ========================================================================
   11 · TECLADO DO APP
   ===================================================================== */
var KB=null;
function abreKb(cfg){
  KB={v:cfg.v===null||cfg.v===undefined?'':String(cfg.v).replace('.',','),cfg:cfg,virgem:true};
  pintaKb();
}
function fechaKb(){ KB=null; document.getElementById('kbd').hidden=true; }
function pintaKb(){
  var el=document.getElementById('kbd');
  if(!KB){ el.hidden=true; return; }
  var c=KB.cfg;
  var h='<div class="kb-h"><strong class="num">'+(KB.v===''?'<span style="color:var(--muted)">—</span>':esc(KB.v))+
        '<span class="caret"></span>'+(c.un?'<span class="un"> '+c.un+'</span>':'')+'</strong>'+
        '<span>'+c.rot+'</span></div><div class="keys">';
  ['1','2','3','4','5','6','7','8','9'].forEach(function(k){ h+='<button '+a('k:'+k)+'>'+k+'</button>'; });
  h+=(c.dec?'<button '+a('k:,')+' aria-label="vírgula">,</button>':'<button class="soft" disabled>·</button>');
  h+='<button '+a('k:0')+'>0</button><button class="soft" '+a('k:back')+' aria-label="apagar">⌫</button>';
  h+='<button class="go wide" '+a('kok')+'>'+esc(c.ok)+'</button>'+
     '<button class="soft" '+a('kcancel')+'>'+(c.cancel||'Cancelar')+'</button>';
  h+='</div>';
  el.innerHTML=h; el.hidden=false;
}
function teclaKb(k){
  if(!KB) return;
  if(KB.virgem&&k!=='back'){ KB.v=''; KB.virgem=false; }
  if(k==='back'){ KB.v=KB.v.slice(0,-1); KB.virgem=false; }
  else if(k===','){ if(KB.v.indexOf(',')<0&&KB.v!=='') KB.v+=','; }
  else {
    var p=KB.v.split(','); if(p[1]&&p[1].length>=(KB.cfg.dec||1)) return;
    if(KB.v.replace(',','').length>=5) return;
    KB.v+=k;
  }
  pintaKb();
}
function valorKb(){ var s=KB.v.replace(',','.'); if(s===''||isNaN(parseFloat(s))) return null; return parseFloat(s); }

/* ========================================================================
   12 · PINTAR
   ===================================================================== */
var scrollMemo={};
function render(dir){
  var stack=document.getElementById('stack');
  var old=stack.firstChild;
  var foco0=null;
  if(old){
    var sc=old.querySelector('.scroll'); if(sc&&sc.dataset.sc) scrollMemo[sc.dataset.sc]=sc.scrollTop;
    var af=document.activeElement;
    if(af&&af!==document.body&&old.contains(af)) foco0=af.getAttribute('data-act');
  }
  var html = ST.tela==='sessao'?telaSessao() : ST.tela==='corpo'?telaCorpo() : ST.tela==='bio'?telaBio() : telaDia();
  var scr=document.createElement('div');
  scr.className='scr'+(dir==='f'?' in-f':dir==='b'?' in-b':'');
  scr.innerHTML=html;
  stack.innerHTML=''; stack.appendChild(scr);
  var ns=scr.querySelector('.scroll');
  if(ns&&ns.dataset.sc&&scrollMemo[ns.dataset.sc]!==undefined) ns.scrollTop=scrollMemo[ns.dataset.sc];
  /* o que abriu precisa aparecer: uma linha que se abre fora da vista não existe */
  var op=scr.querySelector('.open');
  if(op&&ns){
    var oTop=op.offsetTop, oBot=oTop+op.offsetHeight;
    if(oBot>ns.scrollTop+ns.clientHeight) ns.scrollTop=oBot-ns.clientHeight+8;
    else if(oTop-60<ns.scrollTop) ns.scrollTop=Math.max(0,oTop-60);
  }
  /* quem estava com o foco continua com ele, se ainda existir */
  if(foco0){
    var alvo=scr.querySelector('[data-act="'+foco0.replace(/"/g,'')+'"]');
    if(alvo){ try{ alvo.focus({preventScroll:true}); }catch(e){ try{alvo.focus();}catch(e2){} } }
  }
  /* folha */
  var sh=document.getElementById('sheet');
  if(ST.folha&&ST.tela==='sessao'){ sh.innerHTML=folhaDia(); sh.hidden=false; } else { sh.hidden=true; sh.innerHTML=''; }
  pintaKb();
  pintaMeta();
  ST.flash=null; ST.flashCell=null;
  save();
}
function pintaMeta(){
  var el=document.getElementById('meta'), g=document.getElementById('grip');
  if(!ST.metaAberto){ el.hidden=true; g.setAttribute('aria-expanded','false'); return; }
  g.setAttribute('aria-expanded','true');
  el.innerHTML='<h2>Protótipo</h2>'+
    '<p>Tema — a decisão do dono é seguir o aparelho, com troca manual. O protótipo abre claro.</p>'+
    '<div class="seg3" role="group" aria-label="Tema">'+
      '<button '+a('tema:auto')+' aria-pressed="'+(ST.tema==='auto')+'">Automático</button>'+
      '<button '+a('tema:claro')+' aria-pressed="'+(ST.tema==='claro')+'">Claro</button>'+
      '<button '+a('tema:escuro')+' aria-pressed="'+(ST.tema==='escuro')+'">Escuro</button>'+
    '</div>'+
    '<div class="row-b"><button class="btn line" style="flex:1" '+a('reset')+'>Começar de novo</button>'+
    '<button class="btn solid" '+a('metafecha')+'>Fechar</button></div>';
  el.hidden=false;
}
function diz(m){ var s=document.getElementById('say'); s.textContent=''; setTimeout(function(){s.textContent=m;},30); }
function tema(){ document.documentElement.setAttribute('data-tema',ST.tema==='auto'?'auto':ST.tema); }

/* ========================================================================
   13 · AÇÕES
   ===================================================================== */
function ir(t,dir){
  if(ST.tela===t) return;
  ST.tela=t; ST.folha=false; ST.toast=null; ST.sess.corrigindo=null; ST.sess.kgTmp=null; KB=null;
  try{ if(history.replaceState) history.replaceState(null,'','#/'+t); }catch(e){}
  render(dir);
}

var ACT={
  nada:function(){},
  meta:function(){ ST.metaAberto=!ST.metaAberto; pintaMeta(); },
  metafecha:function(){ ST.metaAberto=false; pintaMeta(); },
  tema:function(v){ ST.tema=v; tema(); pintaMeta(); save(); },
  reset:function(){
    try{ window.localStorage.removeItem(KEY); }catch(e){}
    ST=novo(); clockBase=ST.clock; wallBase=Date.now(); tema(); ST.metaAberto=false; render();
    diz('Protótipo recomeçado: terça, 6:55, série 10 de 20.');
  },

  ir:function(t){ ir(t, (t==='hoje'&&ST.tela!=='hoje')?'b':'f'); },
  dia:function(d){
    ST.dia=d; ST.refAberta=null; ST.toast=null; ST.tela='hoje'; ST.folha=false;
    ST.sess.corrigindo=null; ST.sess.kgTmp=null; KB=null;
    render(d==='28'?'f':'b');
  },
  pendnao:function(){ ST.pendOnte=false; render(); },

  /* ---- sessão ---- */
  reg:function(ex,set,reps){
    ex=+ex; set=+set; reps=+reps;
    var E=ST.sess.exs, s=E[ex].s[set];
    var corr=!!ST.sess.corrigindo;
    var kg=(ST.sess.kgTmp!==null&&ST.sess.kgTmp!==undefined)?ST.sess.kgTmp
          :(corr?s.kg:(s.extra?E[ex].s[set-1].kg:refSet(ex,set).kg));
    s.kg=kg; s.r=reps;
    if(!corr){ s.feita=true; s.t=Math.round(agora()); ST.sess.restFrom=s.t; }
    ST.sess.corrigindo=null; ST.sess.kgTmp=null;
    ST.flash='set-'+ex+'-'+set;
    diz(corr?('Série '+(set+1)+' corrigida: '+kgf(kg)+' por '+reps+' repetições.')
            :('Série '+(set+1)+' gravada neste aparelho: '+kgf(kg)+' quilos por '+reps+' repetições.'));
    render();
  },
  corrigir:function(ex,set){ ST.sess.corrigindo={ex:+ex,set:+set}; ST.sess.kgTmp=null; render(); },
  cancelar:function(){ ST.sess.corrigindo=null; ST.sess.kgTmp=null; render(); },
  apagar:function(ex,set){
    ex=+ex; set=+set; var st=ST.sess.exs[ex], s=st.s[set];
    if(s.extra){ st.s.splice(set,1); } else { st.s[set]={feita:false,kg:null,r:null,rir:null,extra:false,t:null}; }
    ST.sess.corrigindo=null; ST.sess.kgTmp=null;
    diz('Série apagada. A linha volta a previsto.');
    render();
  },
  rir:function(ex,set,v){
    ex=+ex; set=+set; v=+v;
    var s=ST.sess.exs[ex].s[set];
    s.rir=(s.rir===v)?null:v;
    diz(s.rir===null?'RIR apagado.':('RIR '+v+' gravado na série '+(set+1)+'.'));
    render();
  },
  extra:function(ex){
    ex=+ex; var st=ST.sess.exs[ex];
    st.s.push({feita:false,kg:null,r:null,rir:null,extra:true,t:null});
    diz('Série extra aberta. Fica marcada como extra, só hoje.');
    render();
  },
  carga:function(){
    var cur=ST.sess.corrigindo||cursor(); if(!cur) return;
    var E=ST.sess.exs, s=E[cur.ex].s[cur.set];
    var base=(ST.sess.kgTmp!==null&&ST.sess.kgTmp!==undefined)?ST.sess.kgTmp
            :(ST.sess.corrigindo?s.kg:(s.extra?E[cur.ex].s[cur.set-1].kg:refSet(cur.ex,cur.set).kg));
    abreKb({v:base,un:'kg',dec:1,rot:'carga em quilos, com vírgula<br>'+esc(EXS[cur.ex].n),ok:'OK · repetições',
      onOk:function(v){ ST.sess.kgTmp=v; fechaKb(); render(); }});
  },
  outro:function(){
    var cur=cursor(); if(!cur) return;
    abreKb({v:null,un:'rep',dec:0,rot:'repetições desta série<br>alvo '+EXS[cur.ex].rep,ok:'Gravar a série',
      onOk:function(v){ if(v===null||v<1){fechaKb();render();return;} fechaKb(); ACT.reg(cur.ex,cur.set,Math.round(v)); }});
  },
  folha:function(){ ST.folha=true; render(); },
  fecharfolha:function(){ ST.folha=false; render(); },

  /* ---- comida ---- */
  ref:function(d,k){
    var id=d+':'+k;
    ST.refAberta=(ST.refAberta===id)?null:id;
    render();
  },
  marcar:function(d,k,v){
    var antes=conhecido(d);
    var atual=ST.dias[d].ref[k]||null;
    ST.dias[d].ref[k]=(atual===v)?null:v;
    var nome=REFS.filter(function(r){return r.k===k;})[0].n;
    ST.flash='ref-'+d+'-'+k;
    if(conhecido(d)!==antes){ ST.flashCell=(d==='28'?12:13); }
    ST.refAberta=null;
    ST.toast=(ST.dias[d].ref[k]?nome+': '+({tudo:'tudo',metade:'metade',sei:'saiu do plano, e sabe',naosei:'saiu do plano, sem saber',nada:'não comi'})[v]:nome+' sem marca')+
             ', gravado aqui. Comida conhecida: '+conta14()+' de 14 dias.';
    ST.ultimoToque={tipo:'ref',d:d,k:k,antes:atual};
    diz(ST.toast+' Dias conhecidos: '+conta14()+' de 14.');
    render();
  },
  marcarf:function(k,v){   /* da folha sobre a sessão */
    var atual=ST.dias['29'].ref[k]||null;
    ST.dias['29'].ref[k]=(atual===v)?null:v;
    diz('Pré-treino marcado sem sair da sessão. Dias conhecidos: '+conta14()+' de 14.');
    render();
  },
  agua:function(d){ ST.dias[d].agua=(ST.dias[d].agua||0)+1; diz(ST.dias[d].agua+' copos de água.'); render(); },
  aguamenos:function(d){ var v=(ST.dias[d].agua||0)-1; ST.dias[d].agua=v>0?v:null; render(); },
  desfazer:function(){
    var u=ST.ultimoToque;
    if(u&&u.tipo==='ref'){ ST.dias[u.d].ref[u.k]=u.antes; }
    if(u&&u.tipo==='peso'){ ST.pesos['29']=u.antes; }
    ST.toast=null; ST.ultimoToque=null; diz('Desfeito.'); render();
  },

  /* ---- corpo ---- */
  peso:function(){
    var v=ST.pesos['29'];
    abreKb({v:(v===null||v===undefined)?PESO_ANT.v:v,un:'kg',dec:1,
      rot:'quilos, uma casa decimal<br>a última foi '+dec1(PESO_ANT.v)+' em '+PESO_ANT.d,
      ok:'Gravar em 29/09',cancel:'Cancelar',
      onOk:function(x){
        if(x===null){ fechaKb(); render(); return; }
        ST.ultimoToque={tipo:'peso',antes:ST.pesos['29']};
        ST.pesos['29']=x; ST.toast='Gravado neste aparelho · 29/09';
        fechaKb(); diz('Peso '+dec1(x)+' quilos gravado em 29/09. A semana passa a ter '+pesoSemana().n+' pesagens.');
        render();
      }});
  },
  pesoapaga:function(){ ST.ultimoToque={tipo:'peso',antes:ST.pesos['29']}; ST.pesos['29']=null; ST.toast=null; diz('Pesagem apagada.'); render(); },

  /* ---- bio ---- */
  bio:function(k){
    var f=BIO.filter(function(x){return x.k===k;})[0];
    var i=BIO.indexOf(f), prox=BIO[i+1];
    ST.bioCampo=k;
    abreKb({v:ST.bio[k],un:f.un,dec:f.dec,
      rot:esc(f.n)+(prox?'<br>o campo seguinte é '+esc(prox.n):'<br>último campo'),
      ok:prox?'Próximo campo':'Fechar',cancel:'Fechar',
      onOk:function(v){
        if(v!==null) ST.bio[k]=v;
        if(prox){ ACT.bio(prox.k); }
        else { ST.bioCampo=null; fechaKb(); render(); }
      }});
    render();
  },

  k:function(x){ teclaKb(x); },
  kok:function(){ if(KB&&KB.cfg.onOk) KB.cfg.onOk(valorKb()); },
  kcancel:function(){ ST.bioCampo=null; fechaKb(); render(); }
};

/* ========================================================================
   14 · LIGAÇÃO
   ===================================================================== */
document.getElementById('app').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');
  if(!b) return;
  if(b.getAttribute('aria-disabled')==='true'||b.disabled) return;
  var parts=b.getAttribute('data-act').split(':');
  var fn=ACT[parts[0]];
  if(!fn) return;
  ev.preventDefault();
  if(ST.metaAberto&&parts[0]!=='meta'&&parts[0]!=='tema'&&parts[0]!=='reset'&&parts[0]!=='metafecha'){
    ST.metaAberto=false; pintaMeta();
  }
  fn.apply(null,parts.slice(1));
},false);

/* o relógio e o descanso andam sozinhos */
function pulso(){
  if(ST.tela==='sessao'&&!ST.sess.corrigindo){
    var el=document.querySelector('.rest'); if(!el) return;
    var uf=ultimaFeita(); if(!uf) return;
    var rest=Math.max(0,agora()-uf.t), pres=EXS[uf.ex].rest;
    var t=el.querySelector('.t'), r=el.querySelector('.rl'), bar=el.querySelector('.bar i');
    if(t) t.textContent=mmss(rest);
    if(bar) bar.style.width=Math.min(100,Math.round(rest/pres*100))+'%';
    if(rest>pres&&!el.classList.contains('over')){
      el.classList.add('over');
      if(r) r.textContent='passou do lembrete · volte quando der';
    }
    var hm=document.querySelector('.stat .num'); if(hm) hm.textContent=hhmm(agora());
  }
  if(ST.tela==='hoje'){
    var it=document.querySelector('.agora .items .num'), uf2=ultimaFeita();
    if(it&&uf2) it.textContent=mmss(Math.max(0,agora()-uf2.t));
    var nl=document.querySelector('.nowline'); if(nl) nl.textContent='agora '+hhmm(agora());
  }
}

/* arranque */
ST=load();
clockBase=ST.clock||(6*3600+55*60);
wallBase=Date.now();
ST.folha=false; ST.metaAberto=false; ST.refAberta=null; ST.bioCampo=null; ST.sess.corrigindo=null; ST.sess.kgTmp=null;
var hash=(location.hash||'').replace('#/','');
if(['sessao','hoje','corpo','bio'].indexOf(hash)>=0) ST.tela=hash;
tema();
render();
tick=setInterval(pulso,1000);
setInterval(save,15000);
})();
</script>
